<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reproductor">
<meta name="description" content="Tu música en el iPhone, sin internet">
<title>Reproductor DJ</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1f232c;--line:#2a2f3a;--text:#e8eaf0;--mute:#9aa3b2;--acc:#f5a623;--acc2:#c47d12;--bad:#ef5d5d;--ok:#5fd38d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,.btnlab{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,.btnlab:hover{border-color:#3b4250}button:active{transform:scale(.97)}
button.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
button.ic{min-width:44px;padding:0}
button.sm,.btnlab.sm{min-height:40px;padding:0 10px;font-size:13px}
button.ic.sm{padding:0;min-width:40px;min-height:40px}
button:disabled{opacity:.4;cursor:default}
button.tog.on{background:var(--acc);border-color:var(--acc);color:#1a1205}
input[type=search],input[type=text]{font:inherit;font-size:16px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;height:44px;padding:0 12px;outline:none}
input:focus{border-color:var(--acc)}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0 8px 0 0;white-space:nowrap}
#q{flex:1 1 220px;min-width:160px}
.tabs{display:flex;gap:6px}
.tabs button.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
#storbar{padding:6px 14px;font-size:12px;color:var(--mute);background:var(--panel);border-bottom:1px solid var(--line)}
#storbar:empty{display:none}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#chips:empty{display:none}
.chip{border-radius:20px;min-height:40px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1a1205;font-weight:600}
main{overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{padding:6px 14px 30px;max-width:1280px;margin:0 auto}
.genre{margin-top:14px}
.genre>h2{font-size:17px;margin:8px 0;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;min-height:44px}
.genre>h2 small{color:var(--mute);font-weight:400;font-size:13px}
.album{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.ahead{display:flex;gap:12px;align-items:center;padding:8px 10px;cursor:pointer}
.cov{width:60px;height:60px;border-radius:8px;object-fit:cover;background:#232836;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;color:#56607a}
.ainfo{flex:1;min-width:0}
.ainfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ainfo span{color:var(--mute);font-size:13px}
.aact{display:flex;gap:6px;flex:none}
.tracks{border-top:1px solid var(--line)}
.tr{display:grid;grid-template-columns:34px 1fr auto auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #20242d;min-height:52px;cursor:pointer}
.tr:last-child{border-bottom:0}
.tr.playing,.ptr.playing{background:#2a1d0a}
.n{color:var(--mute);text-align:right;font-size:13px}
.tt{min-width:0}
.tt b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span{color:var(--mute);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--mute);font-size:13px;white-space:nowrap;text-align:right}
.bpm{color:var(--ok);font-weight:600;margin-right:6px}
.fmt{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-right:6px}
.btns{display:flex;gap:4px}
.more{padding:10px;text-align:center}
footer{background:var(--panel);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,2fr) auto;gap:14px;align-items:center}
#np{display:flex;gap:10px;align-items:center;min-width:0}
#np .cov{width:52px;height:52px}
#np div.t{min-width:0}
#np b,#np span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np span{color:var(--mute);font-size:13px}
.ctr{display:flex;gap:6px;align-items:center}
.ctr button{min-width:48px;min-height:48px;font-size:18px;border-radius:50%;padding:0}
.ctr button.tog{min-width:44px;min-height:44px;font-size:16px}
#play{background:var(--acc2);border-color:var(--acc2);color:#fff;min-width:56px;min-height:56px}
.seek{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
input[type=range]{flex:1;accent-color:var(--acc);height:30px;min-width:60px}
.vol{display:flex;align-items:center;gap:6px;width:150px}
.pl-layout{display:grid;grid-template-columns:280px 1fr;gap:14px;padding-top:12px}
.pl-list button{width:100%;text-align:left;margin-bottom:6px;justify-content:space-between}
.pl-list button.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.pl-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.pl-head h2{margin:0 10px 0 0;font-size:20px}
.ptr{display:grid;grid-template-columns:28px 34px 1fr auto auto;gap:8px;align-items:center;padding:4px 8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;min-height:56px}
.ptr.missing .tt{opacity:.45}
.ptr.drag{opacity:.4}.ptr.over{border-color:var(--acc)}
.grip{cursor:grab;color:var(--mute);text-align:center;font-size:18px;user-select:none;touch-action:none;padding:10px 0}
.empty{color:var(--mute);padding:20px 0}
.hero{max-width:640px;margin:48px auto;text-align:center;padding:0 8px}
.hero h2{font-size:24px;margin:0 0 10px}
.hero p{color:var(--mute)}
.hero .big{min-height:56px;font-size:18px;padding:0 26px;margin:8px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(440px,92vw);max-height:80vh;overflow:auto}
.modal h3{margin:0 0 12px}
.modal .row{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap}
.modal .opt{width:100%;justify-content:flex-start;margin-bottom:6px}
.modal input{width:100%}
#toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#263241;border:1px solid #3b4d63;padding:10px 16px;border-radius:10px;display:none;z-index:60;max-width:90vw;text-align:center}
.note{color:var(--mute);font-size:13px;margin:10px 0}
.hide{display:none!important}
@media (max-width:900px){footer{grid-template-columns:1fr auto}.seek{grid-column:1/-1;order:3}.vol{display:none}.pl-layout{grid-template-columns:1fr}}
@media (max-width:480px){
 header{padding:8px 10px;gap:8px}
 header h1{font-size:16px;margin:0;flex:1 1 auto}
 .tabs{flex:1 1 100%;order:3}
 .tabs button{flex:1;min-height:44px}
 #q{flex:1 1 100%;min-width:0;order:4;width:100%}
 #addFiles,#pick,#rescan{min-height:44px}
 .hero{margin:28px auto}
 .hero .big{width:100%;max-width:360px}
 .ahead{flex-wrap:wrap}
 .aact{width:100%;justify-content:stretch;padding:0 0 8px}
 .aact button{flex:1;min-height:44px}
 .tr{grid-template-columns:28px 1fr auto;min-height:56px;padding:8px}
 .tr .meta{display:none}
 .ptr{grid-template-columns:28px 28px 1fr auto;min-height:56px}
 .ptr .meta{display:none}
 .btns button{min-width:44px;min-height:44px}
 footer{grid-template-columns:1fr;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
 #np{order:1}
 .ctr{order:2;justify-content:center}
 .seek{order:3;grid-column:auto}
 #np .cov{width:44px;height:44px}
}
</style>
</head>
<body>
<div id="app">
 <div>
  <header>
   <h1>🎧 Reproductor</h1>
   <div class="tabs"><button type="button" id="tabLib" class="on">Biblioteca</button><button type="button" id="tabPl">Playlists</button></div>
   <input id="q" type="search" placeholder="Buscar tema, artista, álbum o género…" autocomplete="off" enterkeyhint="search">
   <button type="button" id="addFiles" class="sm pri" title="Añadir canciones">＋ Canciones</button>
   <button type="button" id="pick" class="sm hide" title="Elegir la carpeta de música">📁 Carpeta</button>
   <button type="button" id="rescan" class="sm hide" title="Volver a leer la carpeta">↻ Actualizar</button>
   <input id="fileInput" type="file" multiple accept="audio/*,.mp3,.m4a,.aac,.wav,.flac" class="hide">
   <input id="dirInput" type="file" webkitdirectory multiple class="hide">
  </header>
  <div id="storbar"></div>
  <div id="chips"></div>
 </div>
 <main id="main"><div class="wrap" id="view"></div></main>
 <footer>
  <div id="np"><div class="cov" id="npCov">♪</div><div class="t"><b id="npT">Elige un tema</b><span id="npA">Funciona sin internet, con tu música en este dispositivo</span></div></div>
  <div class="ctr"><button type="button" id="shuf" class="tog" title="Aleatorio">🔀</button><button type="button" id="prev" title="Anterior">⏮</button><button type="button" id="play" title="Reproducir/Pausa">▶</button><button type="button" id="next" title="Siguiente">⏭</button><button type="button" id="rep" class="tog" title="Repetir: no">🔁</button></div>
  <div class="seek"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="vol">🔊<input id="vol" type="range" min="0" max="100" value="80"></div>
 </footer>
</div>
<audio id="au" preload="auto" playsinline webkit-playsinline></audio>
<div id="toast"></div>
<script>
"use strict";
/* ================= Lector de etiquetas (sin internet) ================= */
const V1G=["Blues","Classic Rock","Country","Dance","Disco","Funk","Grunge","Hip-Hop","Jazz","Metal","New Age","Oldies","Other","Pop","R&B","Rap","Reggae","Rock","Techno","Industrial","Alternative","Ska","Death Metal","Pranks","Soundtrack","Euro-Techno","Ambient","Trip-Hop","Vocal","Jazz+Funk","Fusion","Trance","Classical","Instrumental","Acid","House","Game","Sound Clip","Gospel","Noise","AlternRock","Bass","Soul","Punk","Space","Meditative","Instrumental Pop","Instrumental Rock","Ethnic","Gothic","Darkwave","Techno-Industrial","Electronic","Pop-Folk","Eurodance","Dream","Southern Rock","Comedy","Cult","Gangsta","Top 40","Christian Rap","Pop/Funk","Jungle","Native American","Cabaret","New Wave","Psychadelic","Rave","Showtunes","Trailer","Lo-Fi","Tribal","Acid Punk","Acid Jazz","Polka","Retro","Musical","Rock & Roll","Hard Rock","Folk","Folk-Rock","National Folk","Swing","Fast Fusion","Bebob","Latin","Revival","Celtic","Bluegrass","Avantgarde","Gothic Rock","Progressive Rock","Psychedelic Rock","Symphonic Rock","Slow Rock","Big Band","Chorus","Easy Listening","Acoustic","Humour","Speech","Chanson","Opera","Chamber Music","Sonata","Symphony","Booty Bass","Primus","Porn Groove","Satire","Slow Jam","Club","Tango","Samba","Folklore","Ballad","Power Ballad","Rhythmic Soul","Freestyle","Duet","Punk Rock","Drum Solo","A capella","Euro-House","Dance Hall","Goa","Drum & Bass","Club-House","Hardcore","Terror","Indie","BritPop","Negerpunk","Polsk Punk","Beat","Christian Gangsta Rap","Heavy Metal","Black Metal","Crossover","Contemporary Christian","Christian Rock","Merengue","Salsa","Thrash Metal","Anime","JPop","Synthpop"];
const dLatin=new TextDecoder("latin1"),dU8=new TextDecoder("utf-8"),dU16le=new TextDecoder("utf-16le"),dU16be=new TextDecoder("utf-16be");
const clean=s=>s.replace(/\u0000+$/,"").replace(/\u0000/g,"; ").trim();
async function readBytes(file,start,len){const b=await file.slice(start,start+len).arrayBuffer();return new Uint8Array(b)}
const be32=(b,o)=>((b[o]<<24)>>>0)+(b[o+1]<<16)+(b[o+2]<<8)+b[o+3];
const le32=(b,o)=>(b[o]|(b[o+1]<<8)|(b[o+2]<<16))+((b[o+3]<<24)>>>0);
const ss32=(b,o)=>(b[o]&127)<<21|(b[o+1]&127)<<14|(b[o+2]&127)<<7|(b[o+3]&127);
const str4=(b,o)=>String.fromCharCode(b[o],b[o+1],b[o+2],b[o+3]);
function decText(b,enc){
 if(!b.length)return "";
 if(enc===0)return dLatin.decode(b);
 if(enc===3)return dU8.decode(b);
 if(enc===2)return dU16be.decode(b);
 // enc 1: UTF-16 con BOM (puede haber varias cadenas)
 let out=[],i=0;while(i+1<b.length){let be=false;if(b[i]===0xFE&&b[i+1]===0xFF){be=true;i+=2}else if(b[i]===0xFF&&b[i+1]===0xFE){i+=2}
  let j=i;while(j+1<b.length&&!(b[j]===0&&b[j+1]===0))j+=2;out.push((be?dU16be:dU16le).decode(b.subarray(i,j)));i=j+2}
 return out.join("\u0000");
}
function genreFix(g){if(!g)return g;return g.replace(/\((\d+)\)/g,(m,n)=>V1G[+n]?V1G[+n]+" ":"").replace(/^(\d+)$/,(m,n)=>V1G[+n]||m).trim()}
function unsync(b){const o=[];for(let i=0;i<b.length;i++){o.push(b[i]);if(b[i]===0xFF&&b[i+1]===0)i++}return Uint8Array.from(o)}
function parseID3(b,tag){
 const ver=b[3],flags=b[5],size=ss32(b,6);let d=b.subarray(10,10+size);
 if(ver<4&&(flags&0x80))d=unsync(d);
 let p=0;
 if(flags&0x40){p=ver===4?ss32(d,0):be32(d,0)+4}
 const idLen=ver===2?3:4,hLen=ver===2?6:10;
 while(p+hLen<=d.length){
  const id=ver===2?String.fromCharCode(d[p],d[p+1],d[p+2]):str4(d,p);
  if(!/^[A-Z0-9]+$/.test(id))break;
  let fs=ver===2?(d[p+3]<<16|d[p+4]<<8|d[p+5]):ver===4?ss32(d,p+4):be32(d,p+4);
  const ff=ver===2?0:d[p+9];
  let f=d.subarray(p+hLen,p+hLen+fs);p+=hLen+fs;
  if(ver===4&&(ff&0x02))f=unsync(f);
  if(ver===4&&(ff&0x01))f=f.subarray(4);
  if(!f.length)continue;
  const k=id;
  if(k[0]==="T"&&k!=="TXXX"&&k!=="TXX"){
   const v=clean(decText(f.subarray(1),f[0]));
   const map={TIT2:"title",TT2:"title",TPE1:"artist",TP1:"artist",TALB:"album",TAL:"album",TCON:"genre",TCO:"genre",TBPM:"bpm",TBP:"bpm",TRCK:"track",TRK:"track",TPE2:"albumArtist",TP2:"albumArtist",TKEY:"key",TKE:"key",TLEN:"tlen",TLE:"tlen"};
   if(map[k]&&!tag[map[k]])tag[map[k]]=v;
  }else if(k==="TXXX"||k==="TXX"){
   const parts=decText(f.subarray(1),f[0]).split("\u0000");const desc=(parts[0]||"").toUpperCase();const val=clean(parts.slice(1).join("\u0000"));
   if((desc==="BPM"||desc==="TEMPO")&&!tag.bpm)tag.bpm=val;
   if((desc==="INITIALKEY"||desc==="KEY")&&!tag.key)tag.key=val;
  }else if((k==="APIC"||k==="PIC")&&!tag.pic){
   const enc=f[0];let i=1,mime;
   if(ver===2){const fmt=String.fromCharCode(f[1],f[2],f[3]).toLowerCase();mime=fmt==="png"?"image/png":"image/jpeg";i=4}
   else{let j=i;while(j<f.length&&f[j])j++;mime=dLatin.decode(f.subarray(i,j))||"image/jpeg";i=j+1}
   i++;// tipo de imagen
   if(enc===1||enc===2){while(i+1<f.length&&!(f[i]===0&&f[i+1]===0))i+=2;i+=2}else{while(i<f.length&&f[i])i++;i++}
   if(!/^image\//.test(mime))mime="image/"+(mime.replace(/[^a-z]/gi,"").toLowerCase()||"jpeg");
   tag.pic={mime,data:f.slice(i)};
  }
 }
}
function parseVorbisComments(b,o,tag){
 const vl=le32(b,o);o+=4+vl;const n=le32(b,o);o+=4;
 for(let i=0;i<n&&o+4<=b.length;i++){const l=le32(b,o);o+=4;const s=dU8.decode(b.subarray(o,o+l));o+=l;
  const e=s.indexOf("=");if(e<0)continue;const k=s.slice(0,e).toUpperCase(),v=s.slice(e+1).trim();
  const map={TITLE:"title",ARTIST:"artist",ALBUM:"album",GENRE:"genre",BPM:"bpm",TEMPO:"bpm",TBPM:"bpm",TRACKNUMBER:"track",ALBUMARTIST:"albumArtist",INITIALKEY:"key",KEY:"key"};
  if(map[k]&&!tag[map[k]])tag[map[k]]=v;
  if(k==="METADATA_BLOCK_PICTURE"&&!tag.pic){try{const bin=atob(v);const u=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j);parseFlacPicture(u,0,tag)}catch(x){}}
 }
}
function parseFlacPicture(b,o,tag){if(tag.pic)return;o+=4;const ml=be32(b,o);o+=4;const mime=dLatin.decode(b.subarray(o,o+ml));o+=ml;const dl=be32(b,o);o+=4+dl+16;const len=be32(b,o);o+=4;tag.pic={mime:mime||"image/jpeg",data:b.slice(o,o+len)}}
async function parseFLAC(file,start,tag){
 let o=start+4;
 for(let guard=0;guard<64;guard++){
  const h=await readBytes(file,o,4);if(h.length<4)break;const last=h[0]&0x80,type=h[0]&0x7f,len=h[1]<<16|h[2]<<8|h[3];
  if(type===0||type===4||(type===6&&!tag.pic)){const b=await readBytes(file,o+4,len);
   if(type===0){const sr=(b[10]<<12|b[11]<<4|b[12]>>4);const tot=(b[13]&15)*4294967296+be32(b,14);if(sr&&tot)tag.dur=tot/sr}
   if(type===4)parseVorbisComments(b,0,tag);
   if(type===6)parseFlacPicture(b,0,tag);}
  o+=4+len;if(last)break;
 }
}
async function parseOGG(file,tag){
 const b=await readBytes(file,0,1024*1024);let o=0,page=0,body=[];
 while(o+27<=b.length&&str4(b,o)==="OggS"){const ns=b[o+26];let tot=0;for(let i=0;i<ns;i++)tot+=b[o+27+i];const ds=o+27+ns;
  if(page>0)body.push(b.subarray(ds,ds+tot));o=ds+tot;page++;if(page>40)break;}
 const all=new Uint8Array(body.reduce((s,x)=>s+x.length,0));let k=0;for(const x of body){all.set(x,k);k+=x.length}
 if(all[0]===3&&dLatin.decode(all.subarray(1,7))==="vorbis")parseVorbisComments(all,7,tag);
 else if(dLatin.decode(all.subarray(0,8))==="OpusTags")parseVorbisComments(all,8,tag);
}
async function parseMP4(file,tag){
 let o=0,moov=null;
 for(let g=0;g<200&&o<file.size;g++){const h=await readBytes(file,o,16);if(h.length<8)break;let sz=be32(h,0),hl=8;const t=str4(h,4);
  if(sz===1){sz=be32(h,8)*4294967296+be32(h,12);hl=16}else if(sz===0)sz=file.size-o;if(sz<8)break;
  if(t==="moov"){moov=await readBytes(file,o+hl,Math.min(sz-hl,40*1024*1024));break}o+=sz;}
 if(!moov)return;
 const kids=(b,s,e,cb)=>{let p=s;while(p+8<=e){let sz=be32(b,p);const t=str4(b,p+4);if(sz<8||p+sz>e)sz=e-p;cb(t,p+8,p+sz);p+=sz}};
 kids(moov,0,moov.length,(t,s,e)=>{
  if(t==="mvhd"){const v=moov[s];const ts=v?be32(moov,s+20):be32(moov,s+12);const du=v?be32(moov,s+24)*4294967296+be32(moov,s+28):be32(moov,s+16);if(ts)tag.dur=du/ts}
  if(t==="udta")kids(moov,s,e,(t2,s2,e2)=>{if(t2!=="meta")return;let ms=s2;if(str4(moov,s2+4)!=="hdlr")ms+=4;
   kids(moov,ms,e2,(t3,s3,e3)=>{if(t3!=="ilst")return;
    kids(moov,s3,e3,(it,si,ei)=>{let name=null;
     kids(moov,si,ei,(dt,sd,ed)=>{if(dt==="name")name=dU8.decode(moov.subarray(sd+4,ed));if(dt!=="data")return;
      const type=be32(moov,sd)&0xffffff,v=moov.subarray(sd+8,ed);
      const txt=()=>dU8.decode(v).trim();
      const map={"\u00a9nam":"title","\u00a9ART":"artist","\u00a9alb":"album","\u00a9gen":"genre","aART":"albumArtist"};
      if(map[it]&&!tag[map[it]])tag[map[it]]=txt();
      else if(it==="gnre"&&!tag.genre&&v.length>=2){tag.genre=V1G[(v[0]<<8|v[1])-1]||""}
      else if(it==="tmpo"&&!tag.bpm&&v.length>=2){const n=v[0]<<8|v[1];if(n)tag.bpm=String(n)}
      else if(it==="trkn"&&!tag.track&&v.length>=4){tag.track=String(v[2]<<8|v[3])}
      else if(it==="covr"&&!tag.pic){tag.pic={mime:type===14?"image/png":"image/jpeg",data:v.slice()}}
      else if(it==="----"&&name&&/^(BPM|TEMPO)$/i.test(name)&&!tag.bpm)tag.bpm=txt();
     });});});});
 });
}
async function parseWAV(file,tag){
 let o=12;for(let g=0;g<100&&o+8<=file.size;g++){const h=await readBytes(file,o,8);const id=str4(h,0),sz=le32(h,4);
  if(id==="fmt "){const b=await readBytes(file,o+8,16);tag._br=le32(b,8)}
  else if(id==="data"){if(tag._br)tag.dur=sz/tag._br}
  else if(id==="LIST"){const b=await readBytes(file,o+8,Math.min(sz,1<<20));if(str4(b,0)==="INFO"){let p=4;while(p+8<=b.length){const k=str4(b,p),l=le32(b,p+4);const v=clean(dU8.decode(b.subarray(p+8,p+8+l)));
    const map={INAM:"title",IART:"artist",IPRD:"album",IGNR:"genre",ITRK:"track",IPRT:"track"};if(map[k]&&!tag[map[k]])tag[map[k]]=v;p+=8+l+(l&1)}}}
  else if(id==="id3 "||id==="ID3 "){const b=await readBytes(file,o+8,sz);if(str4(b,0).slice(0,3)==="ID3")parseID3(b,tag)}
  o+=8+sz+(sz&1);}
 delete tag._br;
}
async function readTags(file){
 const tag={};const ext=(file.name.split(".").pop()||"").toLowerCase();
 try{
  const h=await readBytes(file,0,12);let start=0;
  if(h[0]===0x49&&h[1]===0x44&&h[2]===0x33){const size=ss32(h,6)+10+((h[5]&0x10)?10:0);const b=await readBytes(file,0,size);parseID3(b,tag);start=size}
  const h2=start?await readBytes(file,start,12):h;
  const sig=str4(h2,0);
  if(sig==="fLaC")await parseFLAC(file,start,tag);
  else if(sig==="OggS")await parseOGG(file,tag);
  else if(str4(h2,4)==="ftyp")await parseMP4(file,tag);
  else if(sig==="RIFF"&&str4(h2,8)==="WAVE")await parseWAV(file,tag);
  if(!tag.title&&!tag.artist&&file.size>128&&(ext==="mp3"||ext==="aac")){const t=await readBytes(file,file.size-128,128);
   if(t[0]===84&&t[1]===65&&t[2]===71){const s=(a,l)=>clean(dLatin.decode(t.subarray(a,a+l)).replace(/\u0000.*$/,""));
    tag.title=s(3,30);tag.artist=s(33,30);tag.album=s(63,30);if(!tag.genre&&V1G[t[127]])tag.genre=V1G[t[127]];if(t[125]===0&&t[126])tag.track=String(t[126])}}
 }catch(e){console.warn("Etiquetas",file.name,e)}
 if(tag.genre)tag.genre=genreFix(tag.genre);
 if(tag.bpm){const n=parseFloat(String(tag.bpm).replace(",","."));tag.bpm=n>0&&n<400?Math.round(n*10)/10:null}
 if(tag.track){const n=parseInt(tag.track,10);tag.track=isNaN(n)?null:n}
 if(!tag.dur&&tag.tlen){const n=parseInt(tag.tlen,10);if(n>0)tag.dur=n/1000}
 delete tag.tlen;
 return tag;
}

/* ---------- IndexedDB: temas (blobs), carátulas, playlists, kv ---------- */
const DB_NAME="reproductor-offline", DB_VER=2;
let _dbp=null;
function idb(){
 if(_dbp)return _dbp;
 _dbp=new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=()=>{const db=r.result;
   if(!db.objectStoreNames.contains("kv"))db.createObjectStore("kv");
   if(!db.objectStoreNames.contains("tracks"))db.createObjectStore("tracks",{keyPath:"id"});
   if(!db.objectStoreNames.contains("covers"))db.createObjectStore("covers",{keyPath:"dir"});
   if(!db.objectStoreNames.contains("playlists"))db.createObjectStore("playlists",{keyPath:"id"});
  };
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>{_dbp=null;rej(r.error)};
 });
 return _dbp;
}
function txDone(tx){return new Promise((res,rej)=>{tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error("abort"))})}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
async function idbSet(k,v){try{const db=await idb();const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);await txDone(tx)}catch(e){}}
async function idbAll(store){const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction(store).objectStore(store).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
async function idbPut(store,val){const db=await idb();const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(val);await txDone(tx)}
async function idbDel(store,key){const db=await idb();const tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(key);await txDone(tx)}
async function idbGetKey(store,key){const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction(store).objectStore(store).get(key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}

/* ---------- Audio unlock (iOS necesita un gesto del usuario) ---------- */
let audioUnlocked=false, unlockCtx=null;
function unlockAudio(){
 if(audioUnlocked)return;
 audioUnlocked=true;
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(Ctx){
   unlockCtx=unlockCtx||new Ctx();
   if(unlockCtx.state==="suspended")unlockCtx.resume();
   const b=unlockCtx.createBuffer(1,1,22050);
   const s=unlockCtx.createBufferSource();
   s.buffer=b;s.connect(unlockCtx.destination);s.start(0);
  }
 }catch(e){}
}

async function walk(dir,prefix,out,imgs){
 for await(const [name,h] of dir.entries()){
  if(h.kind==="directory"){await walk(h,prefix+name+"/",out,imgs)}
  else if(AUDIO.test(name))out.push({path:prefix+name,h});
  else if(IMG.test(name)||/\.(jpe?g|png|webp)$/i.test(name))(imgs[prefix]=imgs[prefix]||[]).push({name,h});
 }
}
async function pickFolder(){
 if(canDirPicker){
  try{const h=await window.showDirectoryPicker({id:"musica",mode:"read"});dirHandle=h;await idbSet("dir",h);await scanHandle(h)}
  catch(e){if(e.name!=="AbortError"){console.warn(e);if(canWebkitDir)$("#dirInput").click()}}
 }else if(canWebkitDir)$("#dirInput").click();
}
async function reopen(){
 const h=await idbGet("dir");if(!h)return pickFolder();
 try{let p=await h.queryPermission({mode:"read"});if(p!=="granted")p=await h.requestPermission({mode:"read"});
  if(p==="granted"){dirHandle=h;await scanHandle(h)}else toast("Sin permiso para leer la carpeta")}

}

$("#fileInput").onchange=async e=>{
 const fl=[...e.target.files];if(!fl.length)return;
 const items=[];

 const used=new Set(existing.map(r=>r.path));
 for(const f of fl){
  if(!AUDIO.test(f.name)&&!(f.type&&f.type.startsWith("audio/")))continue;
  let path=f.webkitRelativePath||("Importados/"+f.name);
  if(used.has(path)){
   const already=existing.find(r=>r.path===path&&r.size===f.size);
   if(already){items.push({path,file:f});continue}
   const dot=f.name.lastIndexOf(".");
   const base=dot<0?f.name:f.name.slice(0,dot);
   const ext=dot<0?"":f.name.slice(dot);
   let n=2,cand;
   do{cand="Importados/"+base+" ("+n+")"+ext;n++}while(used.has(cand));
   path=cand;
  }
  used.add(path);
  items.push({path,file:f});
 }
 if(!rootName){rootName="Importados";await idbSet("rootName",rootName)}
 await ingestItems(items,null);e.target.value="";

async function ingestItems(items,imgs){
 if(!items.length){toast("No se han encontrado archivos de audio");if(!T.length)renderStart();return}
 showProgress("Leyendo etiquetas de "+items.length+" temas…");
 let added=0,skipped=0,k=0,replaced=0;
 let existing=[];
 try{existing=await idbAll("tracks")}catch(e){toast("No se puede abrir el almacén de este dispositivo");return}
 const byId=new Map(existing.map(r=>[r.id,r]));
 const byPath=new Map(existing.map(r=>[r.path,r]));
 try{
  for(const it of items){
   const file=it.file;
   const path=it.path;
   const id=path+"|"+file.size+"|"+(file.lastModified||0);
   if(byId.has(id)){skipped++;k++;continue}
   if(byPath.has(path)){
    try{await idbDel("tracks",byPath.get(path).id)}catch(e){}
    replaced++;
   }
   const tag=await readTags(file);
   const parts=path.split("/");const fname=parts.pop();const rel=parts.slice(1);
   const folderGenre=rel.length>=2?rel[0]:null;
   const genre=folderGenre||tag.genre||"Sin género";
   const album=tag.album||(rel.length?rel[rel.length-1]:"Sueltos");
   const dir=parts.join("/")+"/";
   const rec={
    id,path,dir,
    title:tag.title||fname.replace(/\.[^.]+$/,""),
    artist:tag.artist||tag.albumArtist||"",
    albumArtist:tag.albumArtist||"",
    album,genre,
    bpm:tag.bpm||null,key:tag.key||"",track:tag.track,
    dur:tag.dur||null,
    ext:(fname.split(".").pop()||"").toUpperCase(),
    mime:file.type||"",
    size:file.size,
    lastModified:file.lastModified||0,
    blob:file,
    pic:tag.pic||null
   };
   await idbPut("tracks",rec);
   byId.set(id,rec);byPath.set(path,rec);
   added++;
   if(++k%8===0){const p=$("#prog");if(p)p.textContent=k+" de "+items.length}
  }
  if(imgs){
   for(const dir in imgs){
    const pref=imgs[dir].find(x=>IMG.test(x.name))||imgs[dir][0];
    try{const f=await pref.get();await idbPut("covers",{dir,blob:f,mime:f.type||"image/jpeg"})}catch(e){}
   }
  }
 }catch(e){
  console.warn(e);
  const quota=e&&(e.name==="QuotaExceededError"||e.code===22);
  toast(quota?"No cabe más música: libera espacio o borra temas de la biblioteca.":"No se pudieron guardar los temas ("+(e.message||e.name)+")",5000);
 }
 await requestPersist();
 await rebuildFromDB();
 const bits=[];
 if(added)bits.push(added+" tema"+(added!==1?"s":"")+" añadido"+(added!==1?"s":""));
 if(replaced)bits.push(replaced+" actualizado"+(replaced!==1?"s":""));
 if(skipped)bits.push(skipped+" ya estaban");
 toast(bits.length?bits.join(" · ")+" en la biblioteca":"No se ha añadido ningún tema",4000);
}

async function rebuildFromDB(){

 recs.sort((a,b)=>String(a.path).localeCompare(String(b.path),"es",{numeric:true}));

 });

 const amap=new Map();A=[];

 for(const a of A){a.c=a.artists.size>2?"Varios artistas":[...a.artists].join(", ");

 for(const t of tracks)t.pic=null;

 const remap=new Map(order.map((o,i)=>[o,i]));A=order.map(i=>A[i]);tracks.forEach(t=>t.a=remap.get(t.a));
 tracks.sort((x,y)=>x.a-y.a||((x.track??1e4)-(y.track??1e4))||x.path.localeCompare(y.path,"es",{numeric:true}));
 T=tracks;byAlbum=A.map(()=>[]);T.forEach((t,i)=>byAlbum[t.a].push(i));
 SEARCH=T.map(t=>norm([t.title,t.artist,t.album,t.genre,t.path].join(" ")));
 PATH=new Map(T.map((t,i)=>[t.path,i]));
 const gs=[...new Set(A.map(a=>a.g))];GENRES=gs.filter(g=>g!=="Sin género").sort((a,b)=>a.localeCompare(b,"es"));if(gs.includes("Sin género"))GENRES.push("Sin género");

 if(dirHandle&&(canDirPicker||canWebkitDir))$("#rescan").classList.remove("hide");
 else $("#rescan").classList.add("hide");

 if(playingId){

   if(nq.length){queue=nq;const startPos=cur>=0&&nq.includes(cur)?nq.indexOf(cur):0;if(shuffle){mkOrder(startPos);qi=0}else{mkOrder();qi=startPos}}
   else{queue=[];qi=-1;order=[]}
  }
 }else{cur=-1}

 renderChips();render();

 probeDurations();
}

  URL.revokeObjectURL(u);if(d){t.dur=d;durCache[t.dk]=Math.round(d);changed++;

let pls=[];
async function loadPlaylists(){
 let fromDb=[],fromLs=[];
 try{fromDb=await idbAll("playlists")}catch(e){}
 try{fromLs=JSON.parse(localStorage.getItem("reproductor.playlists")||"[]")}catch(e){fromLs=[]}
 const byId=new Map();
 for(const p of fromLs)if(p&&p.id)byId.set(p.id,p);
 for(const p of fromDb)if(p&&p.id)byId.set(p.id,p);
 pls=[...byId.values()];
 if(pls.length)await savePlaylists();
}
async function savePlaylists(){
 try{localStorage.setItem("reproductor.playlists",JSON.stringify(pls))}catch(e){}
 try{
  const db=await idb();
  const existing=await idbAll("playlists");
  const ids=new Set(pls.map(p=>p.id));
  const tx=db.transaction("playlists","readwrite");
  const store=tx.objectStore("playlists");
  for(const p of existing)if(!ids.has(p.id))store.delete(p.id);
  for(const p of pls)store.put(p);
  await txDone(tx);
 }catch(e){toast("No se pudo guardar en este navegador")}
}

  r.ondrop=e=>{e.preventDefault();r.classList.remove("over");const to=+r.dataset.k;if(from!==null&&from!==to)move(plGet(st.pl),from,to);from=null}});
 box.querySelectorAll(".grip").forEach(g=>{g.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")return;e.preventDefault();const row=g.closest(".ptr");const k0=+row.dataset.k;row.classList.add("drag");let over=null;g.setPointerCapture(e.pointerId);
  const mv=ev=>{const el=document.elementFromPoint(ev.clientX,ev.clientY);const r=el&&el.closest(".ptr");box.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));if(r){r.classList.add("over");over=+r.dataset.k}};
  const up=ev=>{g.releasePointerCapture(ev.pointerId);g.removeEventListener("pointermove",mv);g.removeEventListener("pointerup",up);row.classList.remove("drag");box.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));if(over!=null&&over!==k0)move(plGet(st.pl),k0,over)};
  g.addEventListener("pointermove",mv);g.addEventListener("pointerup",up)})});
}
function safe(s){return String(s).replace(/[\\/:*?"<>|]/g," ").trim()||"playlist"}
function saveText(name,text,mime){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime||"text/plain"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportM3U(p){
 const lines=["#EXTM3U","#PLAYLIST:"+p.name];
 for(const path of p.tracks){const i=resolve(path);const t=i!=null?T[i]:null;if(t)lines.push(`#EXTINF:${t.dur?Math.round(t.dur):-1},${t.artist?t.artist+" - ":""}${t.title}`);lines.push(stripRoot(path).replace(/\//g,"\\"))}
 saveText(safe(p.name)+".m3u","\ufeff"+lines.join("\r\n")+"\r\n","audio/x-mpegurl");
 toast("Guarda el .m3u dentro de tu carpeta de música para que otros reproductores lo encuentren",5000);
}
async function importM3U(e){
 const f=e.target.files[0];if(!f)return;const txt=(await f.text()).replace(/^\ufeff/,"");
 let name=f.name.replace(/\.m3u8?$/i,"");const paths=[];let miss=0;
 const byName=new Map();T.forEach((t,i)=>{const n=t.path.split("/").pop().toLowerCase();if(!byName.has(n))byName.set(n,i)});
 for(let line of txt.split(/\r?\n/)){line=line.trim();if(!line)continue;if(line.startsWith("#PLAYLIST:")){name=line.slice(10).trim()||name;continue}if(line.startsWith("#"))continue;
  let p=line.replace(/\\/g,"/").replace(/^file:\/\/\/?/i,"");try{p=decodeURIComponent(p)}catch(x){}p=p.replace(/^\.\//,"");
  let i=PATH.has(rootName+"/"+p)?PATH.get(rootName+"/"+p):PATH.has(p)?PATH.get(p):null;
  if(i==null){const low=p.toLowerCase();i=T.findIndex(t=>low.endsWith("/"+stripRoot(t.path).toLowerCase())||low===stripRoot(t.path).toLowerCase());if(i<0)i=null}
  if(i==null){const n=p.split("/").pop().toLowerCase();i=byName.has(n)?byName.get(n):null}
  if(i!=null)paths.push(T[i].path);else{miss++;paths.push(rootName?rootName+"/"+p:p)}}
 const pl=newPl(name);pl.tracks=[...new Set(paths)];st.pl=pl.id;save();renderPl();
 toast(`Playlist “${name}” importada: ${paths.length-miss} de ${paths.length} temas encontrados`,5000);e.target.value="";
}
function setTab(t){st.tab=t;$("#tabLib").classList.toggle("on",t==="lib");$("#tabPl").classList.toggle("on",t==="pl");renderChips();render();$("#main").scrollTop=0}
$("#tabLib").onclick=()=>setTab("lib");$("#tabPl").onclick=()=>setTab("pl");

 }
