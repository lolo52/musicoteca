<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e2dfd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reproductor">
<meta name="description" content="Tu música en el iPhone, sin internet">
<title>Reproductor DJ</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<style>
:root{
  --bg:#d8d5cd;
  --bg-top:#e4e1d8;
  --bg-bot:#b8b5b0;
  --panel:#e6e3db;
  --panel2:#efece4;
  --line:#c4c0b6;
  --text:#2c2a27;
  --mute:#6a6660;
  --acc:#9a5c47;
  --acc2:#8f5743;
  --bad:#b94a4a;
  --ok:#3d7a54;
  --key:#ece9e1;
  --key-hi:#f7f4ee;
  --key-lo:#d4d0c7;
  --ink:#2a2825;
  --frame:#2c2b28;
  --screen:#d0cec8;
  --note:#c5c2bb;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 "SF Pro Text","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;color-scheme:light}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);background:linear-gradient(180deg,var(--bg-top) 0%,#d5d2ca 48%,var(--bg-bot) 100%)}
body.deck-open{overflow:hidden;padding:0}
button,.btnlab{font:inherit;color:inherit;background:linear-gradient(#f3f0e8,#ddd9d0);border:1px solid #b8b4aa;border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 1px 0 #fff8 inset,0 1px 2px rgba(0,0,0,.12)}
button:hover,.btnlab:hover{border-color:#9e998f}
button:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(0,0,0,.18) inset}
button.pri{background:linear-gradient(#b06a54,#8f5743);border-color:#7a4636;color:#fff;box-shadow:0 1px 0 #d4a090 inset,0 1px 2px rgba(0,0,0,.2)}
button.ic{min-width:44px;padding:0}
button.sm,.btnlab.sm{min-height:40px;padding:0 10px;font-size:13px}
button.ic.sm{padding:0;min-width:40px;min-height:40px}
button:disabled{opacity:.4;cursor:default}
button.tog.on{background:linear-gradient(#c47a62,#9a5c47);border-color:#7a4636;color:#fff}
button.key.tog.on{background:linear-gradient(180deg,#f4f1ea 0%,#e4e0d7 55%,#cfcbc2 100%);border:0;color:var(--ink);
  box-shadow:inset 0 2px 0 #fff,inset 0 -2px 3px rgba(0,0,0,.12),0 2px 2px rgba(0,0,0,.25)}
input[type=search],input[type=text]{font:inherit;font-size:16px;color:var(--text);background:#f4f1ea;border:1px solid #b8b4aa;border-radius:10px;height:44px;padding:0 12px;outline:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
input:focus{border-color:var(--acc)}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
body.deck-open #app{visibility:hidden;pointer-events:none}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:linear-gradient(#ece9e1,#ddd9d1);border-bottom:1px solid #c4c0b6;box-shadow:0 1px 0 #fff8 inset}
header h1{font-size:18px;margin:0 8px 0 0;white-space:nowrap}
#q{flex:1 1 220px;min-width:160px}
.tabs{display:flex;gap:6px}
.tabs button.on{background:linear-gradient(#b06a54,#8f5743);border-color:#7a4636;color:#fff}
#storbar{padding:6px 14px;font-size:12px;color:var(--mute);background:transparent;border-bottom:1px solid #c4c0b666}
#storbar:empty{display:none}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;background:transparent;border-bottom:1px solid #c4c0b666}
#chips:empty{display:none}
.chip{border-radius:20px;min-height:40px;font-size:14px}
.chip.on{background:linear-gradient(#c47a62,#9a5c47);border-color:#7a4636;color:#fff;font-weight:600}
main{overflow:auto;-webkit-overflow-scrolling:touch}
body.has-mini main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{padding:6px 14px 30px;max-width:1280px;margin:0 auto}
.genre{margin-top:14px}
.genre>h2{font-size:17px;margin:8px 0;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;min-height:44px}
.genre>h2 small{color:var(--mute);font-weight:400;font-size:13px}
.album{background:linear-gradient(#efece5,#e2dfd7);border:1px solid #c4c0b6;border-radius:14px;margin:8px 0;overflow:hidden;box-shadow:0 1px 0 #fff8 inset,0 2px 6px rgba(0,0,0,.06)}
.ahead{display:flex;gap:12px;align-items:center;padding:8px 10px;cursor:pointer}
.cov{width:60px;height:60px;border-radius:8px;object-fit:cover;background:#d0cec8;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;color:#9a968e}
.ainfo{flex:1;min-width:0}
.ainfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ainfo span{color:var(--mute);font-size:13px}
.aact{display:flex;gap:6px;flex:none}
.tracks{border-top:1px solid #c4c0b6}
.tr{display:grid;grid-template-columns:34px 1fr auto auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #d4d0c8;min-height:52px;cursor:pointer}
.tr:last-child{border-bottom:0}
.tr.playing,.ptr.playing{background:#e8d6cc}
.n{color:var(--mute);text-align:right;font-size:13px}
.tt{min-width:0}
.tt b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span{color:var(--mute);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--mute);font-size:13px;white-space:nowrap;text-align:right}
.bpm{color:var(--ok);font-weight:600;margin-right:6px}
.fmt{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-right:6px}
.btns{display:flex;gap:4px}
.more{padding:10px;text-align:center}
.pl-layout{display:grid;grid-template-columns:280px 1fr;gap:14px;padding-top:12px}
.pl-list button{width:100%;text-align:left;margin-bottom:6px;justify-content:space-between}
.pl-list button.on{background:linear-gradient(#b06a54,#8f5743);border-color:#7a4636;color:#fff}
.pl-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.pl-head h2{margin:0 10px 0 0;font-size:20px}
.ptr{display:grid;grid-template-columns:28px 34px 1fr auto auto;gap:8px;align-items:center;padding:4px 8px;background:linear-gradient(#efece5,#e2dfd7);border:1px solid #c4c0b6;border-radius:10px;margin-bottom:6px;min-height:56px}
.ptr.missing .tt{opacity:.45}
.ptr.drag{opacity:.4}.ptr.over{border-color:var(--acc)}
.grip{cursor:grab;color:var(--mute);text-align:center;font-size:18px;user-select:none;touch-action:none;padding:10px 0}
.empty{color:var(--mute);padding:20px 0}
.hero{max-width:640px;margin:48px auto;text-align:center;padding:0 8px}
.hero h2{font-size:24px;margin:0 0 10px}
.hero p{color:var(--mute)}
.hero .big{min-height:56px;font-size:18px;padding:0 26px;margin:8px}
.modal-bg{position:fixed;inset:0;background:rgba(40,36,32,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal{background:linear-gradient(#f3f0e8,#e4e1d8);border:1px solid #c4c0b6;border-radius:16px;padding:18px;width:min(440px,92vw);max-height:80vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25),0 1px 0 #fff inset;color:var(--text)}
.modal h3{margin:0 0 12px}
.modal .row{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap}
.modal .opt{width:100%;justify-content:flex-start;margin-bottom:6px}
.modal input{width:100%}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2c2a27;color:#f3f0e8;border:0;padding:10px 16px;border-radius:12px;display:none;z-index:90;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
body.deck-open #toast{bottom:calc(140px + env(safe-area-inset-bottom))}
.note{color:var(--mute);font-size:13px;margin:10px 0}
.hide{display:none!important}
.arow{display:flex;gap:12px;align-items:center;padding:10px 12px;background:linear-gradient(#efece5,#e2dfd7);border:1px solid #c4c0b6;border-radius:14px;margin:6px 0;min-height:56px;cursor:pointer;box-shadow:0 1px 0 #fff8 inset}
.arow:active{transform:scale(.99)}
.arow .av{width:44px;height:44px;border-radius:50%;background:#e8d6cc;color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.letter-h{font-size:14px;color:var(--mute);margin:16px 0 4px;padding:0 4px;text-transform:uppercase;letter-spacing:.06em}
.art-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 10px}
.art-head h2{margin:0;font-size:22px;flex:1 1 auto;min-width:0}
.queue-list{max-height:50vh;overflow:auto}
.queue-list .ptr{grid-template-columns:28px 1fr;cursor:pointer}

/* ----- Mini barra ----- */
#mini{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 8px;min-height:64px;background:linear-gradient(#f3f0e8,#ddd9d0);border:1px solid #c4c0b6;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.18),0 1px 0 #fff inset;cursor:pointer;color:inherit;text-align:left;width:auto}
#mini.hide{display:none!important}
#miniCov{width:48px;height:48px;border-radius:8px;background:#d0cec8;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;color:var(--note)}
#miniCov img{width:100%;height:100%;object-fit:cover}
#miniCov .note-ph{width:28px;height:28px}
.mini-t{flex:1;min-width:0}
.mini-t b,.mini-t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-t span{color:var(--mute);font-size:13px}
#miniPlay{width:48px;height:48px;border-radius:12px;flex:none;background:linear-gradient(#f7f4ee,#d8d4cb);border:1px solid #c4c0b6;box-shadow:0 1px 0 #fff inset,0 2px 3px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;padding:0}
#miniPlay svg{width:22px;height:22px;fill:var(--ink)}
#miniPlay .ic-pause{display:none}
#miniPlay.is-playing .ic-play{display:none}
#miniPlay.is-playing .ic-pause{display:block}

/* ----- Reproductor de sobremesa retro ----- */
#deck{display:none;position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,#e6e3da 0%,#d4d1c9 42%,#c2bfb8 78%,#b7b4af 100%);color:var(--ink);-webkit-user-select:none;user-select:none}
body.deck-open #deck{display:flex;flex-direction:column;align-items:center}
.deck-grain{pointer-events:none;position:absolute;inset:0;opacity:.07;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");z-index:0}
.deck-body{position:relative;z-index:1;width:100%;max-width:430px;height:100%;height:100dvh;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 22px calc(18px + env(safe-area-inset-bottom));}
.deck-top{display:flex;align-items:center;justify-content:space-between;min-height:52px;flex:none}
.deck-tools{display:flex;gap:12px;align-items:center}
.round-fill,.round-line{width:42px;height:42px;min-width:42px;min-height:42px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transform:none;touch-action:manipulation}
.round-fill{background:radial-gradient(circle at 35% 30%,#b56d58,#9a5c47 55%,#7e4636);border:1px solid #5c3228;box-shadow:0 2px 3px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 3px rgba(0,0,0,.2);color:#f3ece8}
.round-fill:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(0,0,0,.3),inset 0 2px 3px rgba(0,0,0,.25)}
.round-fill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.round-line{background:linear-gradient(#f5f3ee,#e8e5de);border:2px solid #2c2b28;box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 1px 0 #fff;color:var(--ink)}
.round-line:active{transform:translateY(1px);background:linear-gradient(#e0ddd6,#d4d1ca)}
.round-line svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.round-line svg.filled{fill:currentColor;stroke:none}

.grille{display:block;margin:0 auto;flex:none;color:#3a3835}
.grille-top{margin:10px auto 6px;width:86px;height:36px}
.grille-bot{width:96px;height:28px}
.grille svg{width:100%;height:100%;display:block}

/* CRT */
.crt{flex:1 1 auto;min-height:160px;max-height:min(280px,38vh);width:100%;display:flex;align-items:stretch;margin:2px 0 6px}
.crt-well{flex:1;border-radius:36px;background:linear-gradient(180deg,#c9c5bd,#d6d3cb 42%,#c4c1b9);
  box-shadow:inset 0 14px 22px rgba(0,0,0,.28),inset 0 -5px 10px rgba(255,255,255,.32),inset 10px 0 16px rgba(0,0,0,.1),inset -10px 0 16px rgba(0,0,0,.1);
  padding:16px 18px;display:flex}
.crt-glass{flex:1;border-radius:28px;border:3.5px solid #151413;background:#d3d0c9;
  box-shadow:inset 0 16px 26px rgba(0,0,0,.36),inset 0 -5px 10px rgba(255,255,255,.2),0 0 0 1px #3a3936;
  overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.crt-glass .cov{width:100%;height:100%;border-radius:0;object-fit:cover;background:var(--screen);color:var(--note);font-size:0;display:flex;align-items:center;justify-content:center}
.crt-glass .cov .note-ph,.crt-glass .note-ph{width:34%;height:34%;max-width:110px;max-height:110px;color:#c9c6bf}
.crt-glass img.cov{position:absolute;inset:0;width:100%;height:100%}

/* LED + lower grille */
.deck-mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:64px;flex:none;margin:2px 0 8px}
.led-col{display:flex;flex-direction:column;align-items:center;justify-content:center;width:72px;justify-self:start;padding-left:2px}
.led{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4b4b2,#8a6a68 55%,#5a3a38);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.35),0 1px 1px rgba(255,255,255,.3);
  border:1px solid #6a4a48}
.led.ready{background:radial-gradient(circle at 32% 28%,#ffd0cc,#e24a4a 46%,#9a1818 78%);
  box-shadow:0 0 8px 2px rgba(220,40,40,.4),inset 0 -2px 3px rgba(80,0,0,.35),inset 0 2px 2px rgba(255,255,255,.45);
  border-color:#7a2020}
.led.live{background:radial-gradient(circle at 32% 28%,#ffe2df,#ff5555 40%,#c01818 75%);
  box-shadow:0 0 10px 3px rgba(255,50,50,.7),0 0 22px 6px rgba(255,40,40,.3),inset 0 -2px 3px rgba(80,0,0,.3),inset 0 2px 2px rgba(255,255,255,.55);
  border-color:#a02020;animation:ledpulse 1.6s ease-in-out infinite}
@keyframes ledpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
#ledLab{margin-top:4px;font-size:8px;letter-spacing:.14em;font-weight:600;color:#5c5852;text-transform:uppercase}
.deck-mid .grille-bot{grid-column:2}

/* Título + tecla + */
.now-row{display:flex;align-items:center;gap:12px;flex:none;min-height:52px;margin:2px 0 16px}
.mini-key{width:44px;height:44px;min-width:44px;min-height:44px;padding:0;flex:none;border-radius:8px;background:linear-gradient(#f6f3ec,#dcd8cf);
  border:1px solid #b0aba1;box-shadow:0 1px 0 #fff inset,0 3px 0 #b8b3aa,0 4px 5px rgba(0,0,0,.18);color:var(--ink)}
.mini-key:active,button.mini-key:active{transform:translateY(2px);box-shadow:0 1px 0 #fff inset,0 1px 0 #b8b3aa,0 1px 2px rgba(0,0,0,.18)}
.mini-key svg{width:22px;height:22px}
.now-text{flex:1;min-width:0;overflow:hidden}
.now-text .marq{overflow:hidden;mask-image:linear-gradient(90deg,#000 85%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
.now-text .marq-track{display:flex;align-items:center;white-space:nowrap;width:max-content}
.now-text b,#npT{font-size:22px;font-weight:700;letter-spacing:-.02em;color:#1c1b19;line-height:1.2}
.now-text .marq-dup{font-size:22px;font-weight:700;letter-spacing:-.02em}
.now-text .marq-gap{font-size:22px;font-weight:700;color:#1c1b19}
.now-text .marq-track.scroll{animation:marq var(--marq-s,12s) linear infinite}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(calc(-1 * var(--marq,200px)))}}
#npA{display:block;margin-top:2px;font-size:14px;color:#5a564f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Barra de progreso */
.seek-block{flex:none;margin:0 0 18px}
.seek{display:block;height:22px}
#seek{width:100%;height:22px;margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;outline:none;cursor:pointer}
#seek::-webkit-slider-runnable-track{height:14px;background:#000;border-radius:7px;border:0;box-shadow:inset 0 1px 2px rgba(255,255,255,.15)}
#seek::-moz-range-track{height:14px;background:#000;border-radius:7px;border:0}
#seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:6px;margin-top:-4px;border:1px solid #b0aba1;
  background:
    linear-gradient(#5a5854,#5a5854) 50% 50%/2.5px 11px no-repeat,
    linear-gradient(180deg,#f6f3ec,#d6d2c9);
  box-shadow:0 1px 0 #fff inset,0 2px 3px rgba(0,0,0,.4)}
#seek::-moz-range-thumb{width:22px;height:22px;border-radius:6px;border:1px solid #b0aba1;
  background:
    linear-gradient(#5a5854,#5a5854) 50% 50%/2.5px 11px no-repeat,
    linear-gradient(180deg,#f6f3ec,#d6d2c9);
  box-shadow:0 1px 0 #fff inset,0 2px 3px rgba(0,0,0,.4)}
.times{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;font-variant-numeric:tabular-nums;color:#4a4742;font-weight:500}

/* Teclado */
.keybed{display:flex;gap:3px;flex:none;background:#1c1b18;border:5px solid #1c1b18;border-radius:16px;padding:3px;box-shadow:0 2px 0 rgba(255,255,255,.2),0 4px 10px rgba(0,0,0,.18),inset 0 1px 2px rgba(0,0,0,.6);margin-top:auto}
button.key{flex:1;min-width:0;min-height:64px;height:64px;padding:0;border-radius:14px;border:0;background:linear-gradient(180deg,#f8f5ef 0%,#ebe7df 48%,#d5d1c8 100%);
  box-shadow:inset 0 3px 0 #fff,inset 0 -3px 4px rgba(0,0,0,.14),0 2px 2px rgba(0,0,0,.28);color:var(--ink);transform:none;position:relative}
button.key:hover{border:0}
button.key:active,button.key.pressed{transform:translateY(2px);background:linear-gradient(180deg,#d8d4cb,#c8c4bb);box-shadow:inset 0 2px 4px rgba(0,0,0,.25),inset 0 1px 0 rgba(0,0,0,.08)}
button.key svg{width:26px;height:26px;fill:var(--ink)}
#play .ic-pause{display:none}
#play.is-playing .ic-play{display:none}
#play.is-playing .ic-pause{display:block}
#rep.one::after{content:"1";position:absolute;right:7px;bottom:6px;font-size:10px;font-weight:700;color:var(--acc2)}
#rep.on svg{fill:var(--acc2)}

.vol-row{display:flex;align-items:center;gap:10px;width:100%;margin:8px 0 14px;font-size:15px}
.vol-row input[type=range]{flex:1;accent-color:var(--acc);height:30px}
.more-modal .opt{margin-bottom:8px}

@media (max-width:900px){.pl-layout{grid-template-columns:1fr}}
@media (max-width:480px){
  header{padding:8px 10px;gap:8px}
  header h1{font-size:16px;margin:0;flex:1 1 auto}
  .tabs{flex:1 1 100%;order:3}
  .tabs button{flex:1;min-height:44px;padding:0 8px;font-size:14px}
  .art-head h2{font-size:20px}
  .art-head button{min-height:44px;flex:1 1 auto}
  #artBack{flex:0 0 auto}

<script>

/* ================= Lector de etiquetas (sin internet) ================= */
const V1G=["Blues","Classic Rock","Country","Dance","Disco","Funk","Grunge","Hip-Hop","Jazz","Metal","New Age","Oldies","Other","Pop","R&B","Rap","Reggae","Rock","Techno","Industrial","Alternative","Ska","Death Metal","Pranks","Soundtrack","Euro-Techno","Ambient","Trip-Hop","Vocal","Jazz+Funk","Fusion","Trance","Classical","Instrumental","Acid","House","Game","Sound Clip","Gospel","Noise","AlternRock","Bass","Soul","Punk","Space","Meditative","Instrumental Pop","Instrumental Rock","Ethnic","Gothic","Darkwave","Techno-Industrial","Electronic","Pop-Folk","Eurodance","Dream","Southern Rock","Comedy","Cult","Gangsta","Top 40","Christian Rap","Pop/Funk","Jungle","Native American","Cabaret","New Wave","Psychadelic","Rave","Showtunes","Trailer","Lo-Fi","Tribal","Acid Punk","Acid Jazz","Polka","Retro","Musical","Rock & Roll","Hard Rock","Folk","Folk-Rock","National Folk","Swing","Fast Fusion","Bebob","Latin","Revival","Celtic","Bluegrass","Avantgarde","Gothic Rock","Progressive Rock","Psychedelic Rock","Symphonic Rock","Slow Rock","Big Band","Chorus","Easy Listening","Acoustic","Humour","Speech","Chanson","Opera","Chamber Music","Sonata","Symphony","Booty Bass","Primus","Porn Groove","Satire","Slow Jam","Club","Tango","Samba","Folklore","Ballad","Power Ballad","Rhythmic Soul","Freestyle","Duet","Punk Rock","Drum Solo","A capella","Euro-House","Dance Hall","Goa","Drum & Bass","Club-House","Hardcore","Terror","Indie","BritPop","Negerpunk","Polsk Punk","Beat","Christian Gangsta Rap","Heavy Metal","Black Metal","Crossover","Contemporary Christian","Christian Rock","Merengue","Salsa","Thrash Metal","Anime","JPop","Synthpop"];
const dLatin=new TextDecoder("latin1"),dU8=new TextDecoder("utf-8"),dU16le=new TextDecoder("utf-16le"),dU16be=new TextDecoder("utf-16be");
const clean=s=>s.replace(/\u0000+$/,"").replace(/\u0000/g,"; ").trim();

const be32=(b,o)=>((b[o]<<24)>>>0)+(b[o+1]<<16)+(b[o+2]<<8)+b[o+3];
const le32=(b,o)=>(b[o]|(b[o+1]<<8)|(b[o+2]<<16))+((b[o+3]<<24)>>>0);
const ss32=(b,o)=>(b[o]&127)<<21|(b[o+1]&127)<<14|(b[o+2]&127)<<7|(b[o+3]&127);

function decText(b,enc){
 if(!b.length)return "";
 if(enc===0)return dLatin.decode(b);
 if(enc===3)return dU8.decode(b);
 if(enc===2)return dU16be.decode(b);
 // enc 1: UTF-16 con BOM (puede haber varias cadenas)
 let out=[],i=0;while(i+1<b.length){let be=false;if(b[i]===0xFE&&b[i+1]===0xFF){be=true;i+=2}else if(b[i]===0xFF&&b[i+1]===0xFE){i+=2}
  let j=i;while(j+1<b.length&&!(b[j]===0&&b[j+1]===0))j+=2;out.push((be?dU16be:dU16le).decode(b.subarray(i,j)));i=j+2}

}
function genreFix(g){if(!g)return g;return g.replace(/\((\d+)\)/g,(m,n)=>V1G[+n]?V1G[+n]+" ":"").replace(/^(\d+)$/,(m,n)=>V1G[+n]||m).trim()}
function unsync(b){const o=[];for(let i=0;i<b.length;i++){o.push(b[i]);if(b[i]===0xFF&&b[i+1]===0)i++}return Uint8Array.from(o)}
function parseID3(b,tag){
 const ver=b[3],flags=b[5],size=ss32(b,6);let d=b.subarray(10,10+size);
 if(ver<4&&(flags&0x80))d=unsync(d);

 if(flags&0x40){p=ver===4?ss32(d,0):be32(d,0)+4}

 while(p+hLen<=d.length){
  const id=ver===2?String.fromCharCode(d[p],d[p+1],d[p+2]):str4(d,p);
  if(!/^[A-Z0-9]+$/.test(id))break;

  if(k[0]==="T"&&k!=="TXXX"&&k!=="TXX"){
   const v=clean(decText(f.subarray(1),f[0]));
   const map={TIT2:"title",TT2:"title",TPE1:"artist",TP1:"artist",TALB:"album",TAL:"album",TCON:"genre",TCO:"genre",TBPM:"bpm",TBP:"bpm",TRCK:"track",TRK:"track",TPE2:"albumArtist",TP2:"albumArtist",TKEY:"key",TKE:"key",TLEN:"tlen",TLE:"tlen"};
   if(map[k]&&!tag[map[k]])tag[map[k]]=v;
  }else if(k==="TXXX"||k==="TXX"){
   const parts=decText(f.subarray(1),f[0]).split("\u0000");const desc=(parts[0]||"").toUpperCase();const val=clean(parts.slice(1).join("\u0000"));
   if((desc==="BPM"||desc==="TEMPO")&&!tag.bpm)tag.bpm=val;
   if((desc==="INITIALKEY"||desc==="KEY")&&!tag.key)tag.key=val;
  }else if((k==="APIC"||k==="PIC")&&!tag.pic){
   const enc=f[0];let i=1,mime;
   if(ver===2){const fmt=String.fromCharCode(f[1],f[2],f[3]).toLowerCase();mime=fmt==="png"?"image/png":"image/jpeg";i=4}
   else{let j=i;while(j<f.length&&f[j])j++;mime=dLatin.decode(f.subarray(i,j))||"image/jpeg";i=j+1}
   i++;// tipo de imagen
   if(enc===1||enc===2){while(i+1<f.length&&!(f[i]===0&&f[i+1]===0))i+=2;i+=2}else{while(i<f.length&&f[i])i++;i++}
   if(!/^image\//.test(mime))mime="image/"+(mime.replace(/[^a-z]/gi,"").toLowerCase()||"jpeg");

  }

}
function parseVorbisComments(b,o,tag){
 const vl=le32(b,o);o+=4+vl;const n=le32(b,o);o+=4;
 for(let i=0;i<n&&o+4<=b.length;i++){const l=le32(b,o);o+=4;const s=dU8.decode(b.subarray(o,o+l));o+=l;
  const e=s.indexOf("=");if(e<0)continue;const k=s.slice(0,e).toUpperCase(),v=s.slice(e+1).trim();
  const map={TITLE:"title",ARTIST:"artist",ALBUM:"album",GENRE:"genre",BPM:"bpm",TEMPO:"bpm",TBPM:"bpm",TRACKNUMBER:"track",ALBUMARTIST:"albumArtist",INITIALKEY:"key",KEY:"key"};
  if(map[k]&&!tag[map[k]])tag[map[k]]=v;
  if(k==="METADATA_BLOCK_PICTURE"&&!tag.pic){try{const bin=atob(v);const u=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j);parseFlacPicture(u,0,tag)}catch(x){}}

function parseFlacPicture(b,o,tag){if(tag.pic)return;o+=4;const ml=be32(b,o);o+=4;const mime=dLatin.decode(b.subarray(o,o+ml));o+=ml;const dl=be32(b,o);o+=4+dl+16;const len=be32(b,o);o+=4;tag.pic={mime:mime||"image/jpeg",data:b.slice(o,o+len)}}

async function parseOGG(file,tag){

 while(o+27<=b.length&&str4(b,o)==="OggS"){const ns=b[o+26];let tot=0;for(let i=0;i<ns;i++)tot+=b[o+27+i];const ds=o+27+ns;

 const all=new Uint8Array(body.reduce((s,x)=>s+x.length,0));let k=0;for(const x of body){all.set(x,k);k+=x.length}
 if(all[0]===3&&dLatin.decode(all.subarray(1,7))==="vorbis")parseVorbisComments(all,7,tag);

async function parseMP4(file,tag){

  if(sz===1){sz=be32(h,8)*4294967296+be32(h,12);hl=16}else if(sz===0)sz=file.size-o;if(sz<8)break;

   kids(moov,ms,e2,(t3,s3,e3)=>{if(t3!=="ilst")return;
    kids(moov,s3,e3,(it,si,ei)=>{let name=null;
     kids(moov,si,ei,(dt,sd,ed)=>{if(dt==="name")name=dU8.decode(moov.subarray(sd+4,ed));if(dt!=="data")return;
      const type=be32(moov,sd)&0xffffff,v=moov.subarray(sd+8,ed);
      const txt=()=>dU8.decode(v).trim();
      const map={"\u00a9nam":"title","\u00a9ART":"artist","\u00a9alb":"album","\u00a9gen":"genre","aART":"albumArtist"};
      if(map[it]&&!tag[map[it]])tag[map[it]]=txt();
      else if(it==="gnre"&&!tag.genre&&v.length>=2){tag.genre=V1G[(v[0]<<8|v[1])-1]||""}
      else if(it==="tmpo"&&!tag.bpm&&v.length>=2){const n=v[0]<<8|v[1];if(n)tag.bpm=String(n)}
      else if(it==="trkn"&&!tag.track&&v.length>=4){tag.track=String(v[2]<<8|v[3])}

async function parseWAV(file,tag){
 let o=12;for(let g=0;g<100&&o+8<=file.size;g++){const h=await readBytes(file,o,8);const id=str4(h,0),sz=le32(h,4);

  else if(id==="data"){if(tag._br)tag.dur=sz/tag._br}
  else if(id==="LIST"){const b=await readBytes(file,o+8,Math.min(sz,1<<20));if(str4(b,0)==="INFO"){let p=4;while(p+8<=b.length){const k=str4(b,p),l=le32(b,p+4);const v=clean(dU8.decode(b.subarray(p+8,p+8+l)));
    const map={INAM:"title",IART:"artist",IPRD:"album",IGNR:"genre",ITRK:"track",IPRT:"track"};if(map[k]&&!tag[map[k]])tag[map[k]]=v;p+=8+l+(l&1)}}}
  else if(id==="id3 "||id==="ID3 "){const b=await readBytes(file,o+8,sz);if(str4(b,0).slice(0,3)==="ID3")parseID3(b,tag)}
  o+=8+sz+(sz&1);}

}
async function readTags(file){
 const tag={};const ext=(file.name.split(".").pop()||"").toLowerCase();

  const h=await readBytes(file,0,12);let start=0;
  if(h[0]===0x49&&h[1]===0x44&&h[2]===0x33){const size=ss32(h,6)+10+((h[5]&0x10)?10:0);const b=await readBytes(file,0,size);parseID3(b,tag);start=size}
  const h2=start?await readBytes(file,start,12):h;
  const sig=str4(h2,0);
  if(sig==="fLaC")await parseFLAC(file,start,tag);
  else if(sig==="OggS")await parseOGG(file,tag);
  else if(str4(h2,4)==="ftyp")await parseMP4(file,tag);
  else if(sig==="RIFF"&&str4(h2,8)==="WAVE")await parseWAV(file,tag);
  if(!tag.title&&!tag.artist&&file.size>128&&(ext==="mp3"||ext==="aac")){const t=await readBytes(file,file.size-128,128);
   if(t[0]===84&&t[1]===65&&t[2]===71){const s=(a,l)=>clean(dLatin.decode(t.subarray(a,a+l)).replace(/\u0000.*$/,""));
    tag.title=s(3,30);tag.artist=s(33,30);tag.album=s(63,30);if(!tag.genre&&V1G[t[127]])tag.genre=V1G[t[127]];if(t[125]===0&&t[126])tag.track=String(t[126])}}
 }catch(e){console.warn("Etiquetas",file.name,e)}
 if(tag.genre)tag.genre=genreFix(tag.genre);
 if(tag.bpm){const n=parseFloat(String(tag.bpm).replace(",","."));tag.bpm=n>0&&n<400?Math.round(n*10)/10:null}
 if(tag.track){const n=parseInt(tag.track,10);tag.track=isNaN(n)?null:n}
 if(!tag.dur&&tag.tlen){const n=parseInt(tag.tlen,10);if(n>0)tag.dur=n/1000}
 delete tag.tlen;
 return tag;
}

/* ---------- IndexedDB: temas (blobs), carátulas, playlists, kv ---------- */
const DB_NAME="reproductor-offline", DB_VER=2;
let _dbp=null;
function idb(){
 if(_dbp)return _dbp;
 _dbp=new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=()=>{const db=r.result;
   if(!db.objectStoreNames.contains("kv"))db.createObjectStore("kv");
   if(!db.objectStoreNames.contains("tracks"))db.createObjectStore("tracks",{keyPath:"id"});
   if(!db.objectStoreNames.contains("covers"))db.createObjectStore("covers",{keyPath:"dir"});
   if(!db.objectStoreNames.contains("playlists"))db.createObjectStore("playlists",{keyPath:"id"});
  };
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>{_dbp=null;rej(r.error)};
 });
 return _dbp;
}
function txDone(tx){return new Promise((res,rej)=>{tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error("abort"))})}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
async function idbSet(k,v){try{const db=await idb();const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);await txDone(tx)}catch(e){}}
async function idbAll(store){const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction(store).objectStore(store).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
async function idbPut(store,val){const db=await idb();const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(val);await txDone(tx)}
async function idbDel(store,key){const db=await idb();const tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(key);await txDone(tx)}
async function idbGetKey(store,key){const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction(store).objectStore(store).get(key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}

/* ---------- Audio unlock (iOS necesita un gesto del usuario) ---------- */
let audioUnlocked=false, unlockCtx=null;
function unlockAudio(){
 if(audioUnlocked)return;
 audioUnlocked=true;
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(Ctx){
   unlockCtx=unlockCtx||new Ctx();
   if(unlockCtx.state==="suspended")unlockCtx.resume();
   const b=unlockCtx.createBuffer(1,1,22050);
   const s=unlockCtx.createBufferSource();
   s.buffer=b;s.connect(unlockCtx.destination);s.start(0);
  }
 }catch(e){}
}
["pointerdown","touchstart","click"].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));

/* ---------- Importar archivos / carpeta ---------- */
async function walk(dir,prefix,out,imgs){
 for await(const [name,h] of dir.entries()){
  if(h.kind==="directory"){await walk(h,prefix+name+"/",out,imgs)}
  else if(AUDIO.test(name))out.push({path:prefix+name,h});
  else if(IMG.test(name)||/\.(jpe?g|png|webp)$/i.test(name))(imgs[prefix]=imgs[prefix]||[]).push({name,h});
 }
}
async function pickFolder(){
 if(canDirPicker){
  try{const h=await window.showDirectoryPicker({id:"musica",mode:"read"});dirHandle=h;await idbSet("dir",h);await scanHandle(h)}
  catch(e){if(e.name!=="AbortError"){console.warn(e);if(canWebkitDir)$("#dirInput").click()}}
 }else if(canWebkitDir)$("#dirInput").click();
}
async function reopen(){
 const h=await idbGet("dir");if(!h)return pickFolder();
 try{let p=await h.queryPermission({mode:"read"});if(p!=="granted")p=await h.requestPermission({mode:"read"});
  if(p==="granted"){dirHandle=h;await scanHandle(h)}else toast("Sin permiso para leer la carpeta")}
 catch(e){console.warn(e);pickFolder()}
}
async function scanHandle(h){

 const files=[],imgs={};await walk(h,h.name+"/",files,imgs);
 const items=[];for(const f of files){items.push({path:f.path,file:await f.h.getFile()})}
 const im={};for(const k in imgs)im[k]=imgs[k].map(x=>({name:x.name,get:()=>x.h.getFile()}));
 rootName=h.name;await idbSet("rootName",rootName);

$("#fileInput").onchange=async e=>{
 const fl=[...e.target.files];if(!fl.length)return;
 const items=[];
 const existing=await idbAll("tracks").catch(()=>[]);
 const used=new Set(existing.map(r=>r.path));
 for(const f of fl){
  if(!AUDIO.test(f.name)&&!(f.type&&f.type.startsWith("audio/")))continue;
  let path=f.webkitRelativePath||("Importados/"+f.name);
  if(used.has(path)){
   const already=existing.find(r=>r.path===path&&r.size===f.size);
   if(already){items.push({path,file:f});continue}
   const dot=f.name.lastIndexOf(".");
   const base=dot<0?f.name:f.name.slice(0,dot);
   const ext=dot<0?"":f.name.slice(dot);
   let n=2,cand;
   do{cand="Importados/"+base+" ("+n+")"+ext;n++}while(used.has(cand));
   path=cand;
  }
  used.add(path);
  items.push({path,file:f});
 }
 if(!rootName){rootName="Importados";await idbSet("rootName",rootName)}

async function ingestItems(items,imgs){
 if(!items.length){toast("No se han encontrado archivos de audio");if(!T.length)renderStart();return}
 showProgress("Leyendo etiquetas de "+items.length+" temas…");
 let added=0,skipped=0,k=0,replaced=0;
 let existing=[];
 try{existing=await idbAll("tracks")}catch(e){toast("No se puede abrir el almacén de este dispositivo");return}
 const byId=new Map(existing.map(r=>[r.id,r]));
 const byPath=new Map(existing.map(r=>[r.path,r]));
 try{
  for(const it of items){
   const file=it.file;
   const path=it.path;
   const id=path+"|"+file.size+"|"+(file.lastModified||0);
   if(byId.has(id)){skipped++;k++;continue}
   if(byPath.has(path)){
    try{await idbDel("tracks",byPath.get(path).id)}catch(e){}
    replaced++;
   }
   const tag=await readTags(file);
   const parts=path.split("/");const fname=parts.pop();const rel=parts.slice(1);
   const folderGenre=rel.length>=2?rel[0]:null;
   const genre=folderGenre||tag.genre||"Sin género";
   const album=tag.album||(rel.length?rel[rel.length-1]:"Sueltos");
   const dir=parts.join("/")+"/";
   const rec={
    id,path,dir,
    title:tag.title||fname.replace(/\.[^.]+$/,""),
    artist:tag.artist||tag.albumArtist||"",
    albumArtist:tag.albumArtist||"",
    album,genre,
    bpm:tag.bpm||null,key:tag.key||"",track:tag.track,
    dur:tag.dur||null,
    ext:(fname.split(".").pop()||"").toUpperCase(),
    mime:file.type||"",
    size:file.size,
    lastModified:file.lastModified||0,
    blob:file,
    pic:tag.pic||null
   };
   await idbPut("tracks",rec);
   byId.set(id,rec);byPath.set(path,rec);
   added++;
   if(++k%8===0){const p=$("#prog");if(p)p.textContent=k+" de "+items.length}
  }
  if(imgs){
   for(const dir in imgs){
    const pref=imgs[dir].find(x=>IMG.test(x.name))||imgs[dir][0];
    try{const f=await pref.get();await idbPut("covers",{dir,blob:f,mime:f.type||"image/jpeg"})}catch(e){}
   }
  }
 }catch(e){
  console.warn(e);
  const quota=e&&(e.name==="QuotaExceededError"||e.code===22);
  toast(quota?"No cabe más música: libera espacio o borra temas de la biblioteca.":"No se pudieron guardar los temas ("+(e.message||e.name)+")",5000);
 }
 await requestPersist();
 await rebuildFromDB();
 const bits=[];
 if(added)bits.push(added+" tema"+(added!==1?"s":"")+" añadido"+(added!==1?"s":""));
 if(replaced)bits.push(replaced+" actualizado"+(replaced!==1?"s":""));
 if(skipped)bits.push(skipped+" ya estaban");
 toast(bits.length?bits.join(" · ")+" en la biblioteca":"No se ha añadido ningún tema",4000);
}

 });

 const amap=new Map();A=[];

  if(ai===undefined){ai=A.length;amap.set(key,ai);A.push({t:t.album,g:t.genre,dir:t.dir,artists:new Set(),pic:null,cover:null})}

 T=tracks;byAlbum=A.map(()=>[]);T.forEach((t,i)=>byAlbum[t.a].push(i));

/* ================= Playlists ================= */
let pls=[];
async function loadPlaylists(){
 let fromDb=[],fromLs=[];
 try{fromDb=await idbAll("playlists")}catch(e){}
 try{fromLs=JSON.parse(localStorage.getItem("reproductor.playlists")||"[]")}catch(e){fromLs=[]}
 const byId=new Map();
 for(const p of fromLs)if(p&&p.id)byId.set(p.id,p);
 for(const p of fromDb)if(p&&p.id)byId.set(p.id,p);
 pls=[...byId.values()];
 if(pls.length)await savePlaylists();
}
async function savePlaylists(){
 try{localStorage.setItem("reproductor.playlists",JSON.stringify(pls))}catch(e){}
 try{
  const db=await idb();
  const existing=await idbAll("playlists");
  const ids=new Set(pls.map(p=>p.id));
  const tx=db.transaction("playlists","readwrite");
  const store=tx.objectStore("playlists");
  for(const p of existing)if(!ids.has(p.id))store.delete(p.id);
  for(const p of pls)store.put(p);
  await txDone(tx);
 }catch(e){toast("No se pudo guardar en este navegador")}
}
const save=()=>{savePlaylists();saveUi()};

 if(st.tab!=="pl")return;

 const sel=e.target.closest("[data-sel]");if(sel){st.pl=sel.dataset.sel;saveUi();renderPl();return}
 const p=plGet(st.pl);if(!p)return;
 const pa=e.target.closest("[data-pa]");
 if(pa){const a=pa.dataset.pa;
  if(a==="play"){const ok=plIdx(p).filter(i=>i!=null);playList(ok,0)}

  if(a==="del")confirmBox(`¿Borrar la playlist “${p.name}”? Tus archivos de música no se tocan.`,()=>{pls=pls.filter(x=>x!==p);st.pl=null;save();renderPl()});
  if(a==="m3u")exportM3U(p);return}
 const ta=e.target.closest("[data-ta]");const row=e.target.closest(".ptr");
 if(ta&&row){const k=+row.dataset.k;const a=ta.dataset.ta;
  if(a==="play"){const idx=plIdx(p);const ok=idx.filter(i=>i!=null);playList(ok,ok.indexOf(idx[k]))}
  if(a==="rm"){p.tracks.splice(k,1);save();renderPl()}
  if(a==="up"&&k>0)move(p,k,k-1);if(a==="down"&&k<p.tracks.length-1)move(p,k,k+1)}
});
function move(p,from,to){const [x]=p.tracks.splice(from,1);p.tracks.splice(to,0,x);save();renderPl();
 if(cur>=0&&!shuffle){const ok=plIdx(p).filter(i=>i!=null);if(ok.includes(cur)&&queue.length===ok.length&&queue.every(i=>ok.includes(i))){queue=ok;mkOrder();qi=ok.indexOf(cur)}}}
function bindDrag(){
 const box=$("#plRows");if(!box)return;let from=null;
 box.querySelectorAll(".ptr").forEach(r=>{
  r.ondragstart=e=>{from=+r.dataset.k;r.classList.add("drag");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",String(from))}catch(x){}};
  r.ondragend=()=>r.classList.remove("drag");r.ondragover=e=>{e.preventDefault();r.classList.add("over")};r.ondragleave=()=>r.classList.remove("over");
  r.ondrop=e=>{e.preventDefault();r.classList.remove("over");const to=+r.dataset.k;if(from!==null&&from!==to)move(plGet(st.pl),from,to);from=null}});
 box.querySelectorAll(".grip").forEach(g=>{g.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")return;e.preventDefault();const row=g.closest(".ptr");const k0=+row.dataset.k;row.classList.add("drag");let over=null;g.setPointerCapture(e.pointerId);
  const mv=ev=>{const el=document.elementFromPoint(ev.clientX,ev.clientY);const r=el&&el.closest(".ptr");box.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));if(r){r.classList.add("over");over=+r.dataset.k}};
  const up=ev=>{g.releasePointerCapture(ev.pointerId);g.removeEventListener("pointermove",mv);g.removeEventListener("pointerup",up);row.classList.remove("drag");box.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));if(over!=null&&over!==k0)move(plGet(st.pl),k0,over)};
  g.addEventListener("pointermove",mv);g.addEventListener("pointerup",up)})});
}
function safe(s){return String(s).replace(/[\\/:*?"<>|]/g," ").trim()||"playlist"}
function saveText(name,text,mime){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime||"text/plain"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportM3U(p){
 const lines=["#EXTM3U","#PLAYLIST:"+p.name];
 for(const path of p.tracks){const i=resolve(path);const t=i!=null?T[i]:null;if(t)lines.push(`#EXTINF:${t.dur?Math.round(t.dur):-1},${t.artist?t.artist+" - ":""}${t.title}`);lines.push(stripRoot(path).replace(/\//g,"\\"))}
 saveText(safe(p.name)+".m3u","\ufeff"+lines.join("\r\n")+"\r\n","audio/x-mpegurl");
 toast("Guarda el .m3u dentro de tu carpeta de música para que otros reproductores lo encuentren",5000);
}
async function importM3U(e){
 const f=e.target.files[0];if(!f)return;const txt=(await f.text()).replace(/^\ufeff/,"");
 let name=f.name.replace(/\.m3u8?$/i,"");const paths=[];let miss=0;
 const byName=new Map();T.forEach((t,i)=>{const n=t.path.split("/").pop().toLowerCase();if(!byName.has(n))byName.set(n,i)});
 for(let line of txt.split(/\r?\n/)){line=line.trim();if(!line)continue;if(line.startsWith("#PLAYLIST:")){name=line.slice(10).trim()||name;continue}if(line.startsWith("#"))continue;
  let p=line.replace(/\\/g,"/").replace(/^file:\/\/\/?/i,"");try{p=decodeURIComponent(p)}catch(x){}p=p.replace(/^\.\//,"");
  let i=PATH.has(rootName+"/"+p)?PATH.get(rootName+"/"+p):PATH.has(p)?PATH.get(p):null;
  if(i==null){const low=p.toLowerCase();i=T.findIndex(t=>low.endsWith("/"+stripRoot(t.path).toLowerCase())||low===stripRoot(t.path).toLowerCase());if(i<0)i=null}
  if(i==null){const n=p.split("/").pop().toLowerCase();i=byName.has(n)?byName.get(n):null}
  if(i!=null)paths.push(T[i].path);else{miss++;paths.push(rootName?rootName+"/"+p:p)}}
 const pl=newPl(name);pl.tracks=[...new Set(paths)];st.pl=pl.id;save();renderPl();
 toast(`Playlist “${name}” importada: ${paths.length-miss} de ${paths.length} temas encontrados`,5000);e.target.value="";
}

/* ===== Artistas (nombres normalizados; feat./ft./vs se agrupan al principal) ===== */
const UNKNOWN_ART="Artista desconocido";
function rawArtistName(i){const t=T[i];return ((t&&(t.artist||t.albumArtist))||(A[t.a]&&A[t.a].c)||"").replace(/\s+/g," ").trim()}
function albumIndex(i){return T[i].a}
function splitArtistNames(raw){
 const s=String(raw||"").replace(/\s+/g," ").trim();
 if(!s)return[];
 return s.split(/\s*(?:\(|\[)?\s*(?:feat(?:uring)?|ft)\.?\s+|\s+vs\.?\s+|\s+versus\s+|\s*\/\s*|\s+&\s+/i)
  .map(p=>p.replace(/[)\]]+/g,"").replace(/\s+/g," ").trim()).filter(Boolean);
}
function pickDisplay(vars){
 const arr=[...vars.entries()];
 const caps=s=>(s.match(/[A-ZÁÉÍÓÚÜÑ]/g)||[]).length;
 arr.sort((a,b)=>b[1]-a[1]||caps(b[0])-caps(a[0])||b[0].length-a[0].length||a[0].localeCompare(b[0],"es"));
 return arr[0][0];
}
let ARTISTS=[],ARTMAP=new Map();
function buildArtists(){
 const map=new Map();
 T.forEach((t,i)=>{
  const names=splitArtistNames(rawArtistName(i));
  const list=names.length?names:[UNKNOWN_ART];
  const seen=new Set();
  for(const n of list){
   const k=norm(n);if(!k)continue;
   let o=map.get(k);if(!o){o={key:k,vars:new Map(),tracks:[],albums:new Set()};map.set(k,o)}
   if(seen.has(k))continue;seen.add(k);
   o.vars.set(n,(o.vars.get(n)||0)+1);
   o.tracks.push(i);o.albums.add(albumIndex(i));
  }
 });
 ARTISTS=[...map.values()].map(o=>(o.name=pickDisplay(o.vars),o.albums=[...o.albums],o)).sort((a,b)=>a.name.localeCompare(b.name,"es",{sensitivity:"base",numeric:true}));
 ARTMAP=new Map(ARTISTS.map(o=>[o.key,o]));
}
function artistLetter(name){const ch=norm(name).charAt(0);return ch>="a"&&ch<="z"?ch.toUpperCase():"#"}
function filterArtists(){
 const w=norm(st.q.trim()).split(/\s+/).filter(Boolean);
 if(!w.length)return ARTISTS;
 return ARTISTS.filter(o=>{
  const blob=norm(o.name)+" "+o.tracks.map(i=>SEARCH[i]).join(" ");
  return w.every(x=>blob.includes(x));
 });
}
function artistVisibleTracks(){
 const w=norm(st.q.trim()).split(/\s+/).filter(Boolean);
 const match=i=>!w.length||w.every(x=>SEARCH[i].includes(x));
 if(st.artist&&ARTMAP.get(st.artist))return ARTMAP.get(st.artist).tracks.filter(match);
 return filterArtists().flatMap(o=>o.tracks.filter(match));
}
function renderArt(){
 if(!T.length){
  $("#view").innerHTML=`<div class="hero"><h2>Artistas</h2><p>Añade canciones a la biblioteca para verlas agrupadas por artista.</p><button type="button" class="pri big" id="hAdd">＋ Añadir canciones</button></div>`;
  const b=$("#hAdd");if(b)b.onclick=()=>$("#fileInput").click();
  return;
 }
 if(st.artist)return renderArtDetail(st.artist);
 const list=filterArtists();
 let h=`<p class="note">${ARTISTS.length} artista${ARTISTS.length!==1?"s":""}. Toca uno para ver sus álbumes y temas; se agrupan aunque el nombre cambie de mayúsculas o traiga «feat.».</p>`;
 if(st.q.trim()&&!list.length){h+=`<p class="empty">Nada coincide con “${esc(st.q)}”.</p>`;$("#view").innerHTML=h;return}
 let last="";
 for(const o of list){
  const L=artistLetter(o.name);
  if(L!==last){h+=`<h2 class="letter-h">${L}</h2>`;last=L}
  const na=o.albums.length,nt=o.tracks.length;
  const m=o.name.match(/[A-ZÁÉÍÓÚÜÑa-záéíóúüñ]/);const ini=(m?m[0]:o.name.charAt(0)).toUpperCase();
  h+=`<div class="arow" data-ak="${esc(o.key)}"><div class="av">${esc(ini)}</div><div class="ainfo"><b>${esc(o.name)}</b><span>${na} álbum${na!==1?"es":""} · ${nt} tema${nt!==1?"s":""}</span></div></div>`;
 }
 $("#view").innerHTML=h;
}
function renderArtDetail(key){
 const o=ARTMAP.get(key);
 if(!o){st.artist=null;return renderArt()}
 const w=norm(st.q.trim()).split(/\s+/).filter(Boolean);
 const tracks=w.length?o.tracks.filter(i=>w.every(x=>SEARCH[i].includes(x))):o.tracks.slice();
 const byA=new Map();
 for(const i of tracks){const ai=albumIndex(i);if(!byA.has(ai))byA.set(ai,[]);byA.get(ai).push(i)}
 const albs=[...byA.keys()].sort((a,b)=>(A[a].t||"").localeCompare(A[b].t||"","es",{numeric:true}));
 const tot=tracks.reduce((s,i)=>s+(T[i].dur||0),0);
 let h=`<div class="art-head"><button type="button" class="sm" id="artBack">← Artistas</button><h2>${esc(o.name)}</h2><span class="note">${o.albums.length} álbum${o.albums.length!==1?"es":""} · ${o.tracks.length} tema${o.tracks.length!==1?"s":""}${tot?" · "+fmt(tot):""}</span></div>
 <div class="art-head"><button type="button" class="pri" data-aa="play" ${tracks.length?"":"disabled"}>▶ Escuchar</button><button type="button" data-aa="add" ${tracks.length?"":"disabled"}>＋ Playlist</button></div>`;
 if(!albs.length)h+=`<p class="empty">Nada coincide con “${esc(st.q)}”.</p>`;
 for(const ai of albs){
  const list=byA.get(ai);const open=st.artOpen[ai]!==false;
  const dur=list.reduce((s,i)=>s+(T[i].dur||0),0);
  const lim=showMore["art-"+ai]?1e9:LIMIT;
  h+=`<div class="album"><div class="ahead" data-a="${ai}">${covHtml(ai)}<div class="ainfo"><b>${esc(A[ai].t)}</b><span>${esc(A[ai].g||"")}${A[ai].g?" · ":""}${list.length} tema${list.length!==1?"s":""}${dur?" · "+fmt(dur):""}</span></div>
  <div class="aact"><button type="button" class="sm" data-act="playalb">▶ Escuchar</button><button type="button" class="sm" data-act="addalb">＋ Playlist</button><button type="button" class="ic sm" data-act="tog">${open?"▲":"▼"}</button></div></div>
  ${open?`<div class="tracks">${list.slice(0,lim).map(trackRow).join("")}${list.length>lim?`<div class="more"><button type="button" class="sm" data-more="art-${ai}">Mostrar ${list.length-lim} más</button></div>`:""}</div>`:""}</div>`;
 }
 $("#view").innerHTML=h;
}
function handleArtClick(e){
 if(e.target.closest("#artBack")){st.artist=null;render();$("#main").scrollTop=0;return}
 if(e.target.closest("#hAdd"))return;
 const aa=e.target.closest("[data-aa]");

  if(a==="play"&&tracks.length)playList(tracks,0);

 const more=e.target.closest("[data-more]");if(more){showMore[more.dataset.more]=1;render();return}
 const act=e.target.closest("[data-act]");const row=e.target.closest(".tr");const head=e.target.closest(".ahead");
 if(row){const i=+row.dataset.i;const ctx=tracks.length?tracks:artistVisibleTracks();
  if(act&&act.dataset.act==="add"){pickPlaylist([T[i].path]);return}
  if(act&&act.dataset.act==="del"){deleteTrack(i);return}
  playList(ctx,ctx.indexOf(i));return}
 if(head){const ai=+head.dataset.a;const a=act&&act.dataset.act;
  const list=(ARTMAP.get(st.artist)||{tracks:[]}).tracks.filter(i=>albumIndex(i)===ai);
  if(a==="playalb"){playList(list,0);return}

  st.artOpen[ai]=!(st.artOpen[ai]!==false);render()}
}

/* ================= Vista retro (pantalla completa y minireproductor) ================= */
const NOTE_SVG='<svg class="note-ph" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="22" cy="50" rx="12" ry="9" transform="rotate(-25 22 50)" fill="currentColor"/><rect x="31.2" y="10" width="3.6" height="38" fill="currentColor"/><path d="M34.8 10c9 1.5 17 6 16.5 16-7-4.5-12-7-16.5-8.5V10z" fill="currentColor"/></svg>';

function setCover(src){
  const el=$("#npCov");
  if(el)el.outerHTML=src?`<img class="cov" id="npCov" src="${src}" alt="">`:`<div class="cov" id="npCov">${NOTE_SVG}</div>`;
  const m=$("#miniCov");
  if(m){if(src){m.innerHTML=`<img src="${src}" alt="">`;m.classList.add("has-img")}else{m.innerHTML=NOTE_SVG;m.classList.remove("has-img")}}

function paintTrack(t){
  if(t){
    $("#npT").textContent=t.title;
    $("#npA").textContent=t.artist||t.album||"Desconocido";
    const mT=$("#miniT"),mA=$("#miniA");
    if(mT)mT.textContent=t.title;if(mA)mA.textContent=t.artist||t.album||"";

  }else{
    $("#npT").textContent="Elige un tema";
    $("#npA").textContent="Funciona sin internet, con tu música en este dispositivo";

function paintLed(){
  const led=$("#led"),lab=$("#ledLab");
  if(!led)return;
  const playing=cur>=0&&!au.paused;
  const ready=cur>=0;
  led.classList.toggle("live",playing);
  led.classList.toggle("ready",ready&&!playing);
  if(lab)lab.textContent=playing?"EN DIRECTO":"LISTO";
}
function syncMiniPlay(){
  const b=$("#miniPlay");
  if(b)b.classList.toggle("is-playing",cur>=0&&!au.paused);
}
function openDeck(){document.body.classList.add("deck-open");const d=$("#deck");if(d)d.setAttribute("aria-hidden","false");syncMarquee();paintLed()}
function closeDeck(){document.body.classList.remove("deck-open");const d=$("#deck");if(d)d.setAttribute("aria-hidden","true")}
function syncMarquee(){
  const wrap=document.querySelector("#np .marq");
  const track=document.querySelector("#np .marq-track");
  const t=$("#npT");
  if(!wrap||!track||!t)return;
  track.classList.remove("scroll");
  const extras=[...track.querySelectorAll(".marq-dup, .marq-gap")];
  extras.forEach(n=>n.remove());
  requestAnimationFrame(()=>{
    if(t.scrollWidth>wrap.clientWidth+8){
      const gap=document.createElement("span");gap.className="marq-gap";gap.textContent="   ·   ";
      const dup=t.cloneNode(true);dup.className="marq-dup";dup.removeAttribute("id");
      track.append(gap,dup);
      const dist=t.scrollWidth+gap.getBoundingClientRect().width;
      track.style.setProperty("--marq",dist+"px");
      track.style.setProperty("--marq-s",Math.max(8,dist/28)+"s");
      track.classList.add("scroll");
    }
  });
}
window.addEventListener("resize",()=>{if(document.body.classList.contains("deck-open"))syncMarquee()});
