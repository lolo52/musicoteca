<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musicoteca</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Musicoteca">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1f232c;--line:#2a2f3a;--text:#e8eaf0;--mute:#9aa3b2;--acc:#3db4f2;--acc2:#1e88c7;--warn:#f0b429;--bad:#ef5d5d;--ok:#5fd38d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 "Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 14px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:#3b4250}button:active{transform:scale(.97)}
button.pri{background:var(--acc2);border-color:var(--acc2)}
button.ic{min-width:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
button.sm{min-height:34px;padding:0 10px;font-size:13px}
button:disabled{opacity:.4;cursor:default}
input[type=search],input[type=text]{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;height:42px;padding:0 12px;outline:none}
input:focus{border-color:var(--acc)}
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0 8px 0 0;white-space:nowrap}
#q{flex:1 1 260px;min-width:200px}
.tabs{display:flex;gap:6px}
.tabs button.on{background:var(--acc2);border-color:var(--acc2)}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.chip{border-radius:20px;min-height:36px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#05202f;font-weight:600}
main{overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{padding:6px 14px 30px;max-width:1280px;margin:0 auto}
.genre{margin-top:14px}
.genre>h2{font-size:17px;margin:8px 0;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.genre>h2 small{color:var(--mute);font-weight:400;font-size:13px}
.album{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.ahead{display:flex;gap:12px;align-items:center;padding:8px 10px;cursor:pointer}
.ahead img{width:60px;height:60px;border-radius:8px;object-fit:cover;background:#222;flex:none}
.ainfo{flex:1;min-width:0}
.ainfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ainfo span{color:var(--mute);font-size:13px}
.lic{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:#20324a;color:#bfe0ff;margin-left:6px;text-decoration:none}
.lic.no{background:#4a3313;color:#ffd58a}
.aact{display:flex;gap:6px;flex:none}
.tracks{border-top:1px solid var(--line)}
.tr{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:4px 10px;border-bottom:1px solid #20242d;min-height:48px}
.tr:last-child{border-bottom:0}
.tr.playing{background:#16304a}
.tr .n{color:var(--mute);text-align:right;font-size:13px}
.tt{min-width:0}
.tt b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span{color:var(--mute);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--mute);font-size:13px;white-space:nowrap;text-align:right}
.bpm{color:var(--ok);font-weight:600;margin-right:6px}
.btns{display:flex;gap:4px}
.more{padding:10px;text-align:center}
footer{background:var(--panel);border-top:1px solid var(--line);padding:8px calc(14px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,2fr) auto;gap:14px;align-items:center}
#np{display:flex;gap:10px;align-items:center;min-width:0}
#np img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#222;flex:none}
#np div{min-width:0}
#np b,#np span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np span{color:var(--mute);font-size:13px}
.ctr{display:flex;gap:6px}
.ctr button{min-width:48px;min-height:48px;font-size:18px;border-radius:50%}
#play{background:var(--acc2);border-color:var(--acc2);min-width:56px;min-height:56px}
.seek{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
input[type=range]{flex:1;accent-color:var(--acc);height:30px;min-width:60px}
.vol{display:flex;align-items:center;gap:6px;width:150px}
.pl-layout{display:grid;grid-template-columns:280px 1fr;gap:14px;padding-top:12px}
.pl-list button{width:100%;text-align:left;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.btnlink{display:inline-flex;align-items:center;min-height:34px;padding:0 10px;font-size:13px;color:var(--text);text-decoration:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;white-space:nowrap}.btnlink:hover{border-color:#3b4250}
.pl-list button.on{background:var(--acc2);border-color:var(--acc2)}
.pl-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.pl-head h2{margin:0 10px 0 0;font-size:20px}
.ptr{display:grid;grid-template-columns:28px 34px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:4px 8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;min-height:52px}
.ptr.drag{opacity:.4}.ptr.over{border-color:var(--acc)}
.grip{cursor:grab;color:var(--mute);text-align:center;font-size:18px;user-select:none}
.empty{color:var(--mute);padding:20px 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(440px,92vw);max-height:80vh;overflow:auto}
.modal h3{margin:0 0 12px}
.modal .row{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap}
.modal .opt{width:100%;text-align:left;margin-bottom:6px}
.modal input{width:100%}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#263241;border:1px solid #3b4d63;padding:10px 16px;border-radius:10px;display:none;z-index:60;max-width:90vw}
.note{color:var(--mute);font-size:13px;margin:10px 0}
@media (max-width:900px){footer{grid-template-columns:1fr auto;}.seek{grid-column:1/-1;order:3}.vol{display:none}.pl-layout{grid-template-columns:1fr}}
@media (max-width:700px){
 body{font-size:16px}
 header{gap:8px}
 header h1{font-size:17px;margin:0;flex:1}
 .tabs button{min-height:44px}
 #q{order:5;flex:1 1 100%;height:44px;font-size:16px}
 #expAll,#colAll{display:none!important}
 #chips{min-width:0;max-width:100vw;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 #chips::-webkit-scrollbar{display:none}
 .chip{flex:none;min-height:40px}
 .wrap{padding:4px 10px 24px}
 .ahead{flex-wrap:wrap;gap:10px;padding:10px}
 .ahead img{width:56px;height:56px}
 .ainfo{flex:1 1 calc(100% - 70px)}
 .aact{flex:1 1 100%;flex-wrap:wrap}
 .aact button,.aact .btnlink{min-height:44px;font-size:14px;flex:1 1 auto;justify-content:center}
 .aact [data-act=tog]{flex:0 0 48px}
 .tr{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"tt btns" "meta btns";column-gap:8px;row-gap:0;padding:6px 10px;min-height:58px}
 .tr .n{display:none}
 .tr .tt{grid-area:tt}.tr .meta{grid-area:meta;text-align:left;font-size:12px}.tr .btns{grid-area:btns}
 .btns button.ic.sm{min-width:44px;min-height:44px;font-size:16px}
 footer{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding-top:6px}
 #np img{width:44px;height:44px}
 .ctr button{min-width:44px;min-height:44px}
 #play{min-width:52px;min-height:52px}
 .seek{grid-column:1/-1;order:3}
 .pl-layout{padding-top:8px;gap:8px}
 .pl-list{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
 .pl-list button{width:auto;flex:none;margin:0;min-height:44px;gap:10px}
 .pl-list #plNew{margin:0!important}
 .pl-head button{min-height:44px;flex:1 1 auto}
 .ptr{grid-template-columns:24px minmax(0,1fr) auto;grid-template-areas:"grip tt meta" "btns btns btns";padding:6px 8px}
 .ptr .n{display:none}.ptr .grip{grid-area:grip}.ptr .tt{grid-area:tt}.ptr .meta{grid-area:meta}
 .ptr .btns{grid-area:btns;justify-content:flex-end}
 .ptr .btns button{min-width:48px;min-height:44px}
 .modal button{min-height:46px}
 #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="app">
 <div>
  <header>
   <h1>🎧 Musicoteca</h1>
   <div class="tabs"><button id="tabLib" class="on">Biblioteca</button><button id="tabPl">Playlists</button></div>
   <input id="q" type="search" placeholder="Buscar tema, artista o álbum…" autocomplete="off">
   <button id="expAll" class="sm">Abrir todos</button><button id="colAll" class="sm">Cerrar todos</button>
  </header>
  <div id="chips"></div>
 </div>
 <main id="main"><div class="wrap" id="view"></div></main>
 <footer>
  <div id="np"><img id="npImg" alt=""><div><b id="npT">Elige un tema para escuchar</b><span id="npA">El audio se escucha desde Internet Archive (necesita internet)</span></div></div>
  <div class="ctr"><button id="prev" class="ic" title="Anterior">⏮</button><button id="play" class="ic" title="Reproducir/Pausa">▶</button><button id="next" class="ic" title="Siguiente">⏭</button></div>
  <div class="seek"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="vol">🔊<input id="vol" type="range" min="0" max="100" value="80"></div>
 </footer>
</div>
<audio id="au" preload="none"></audio>
<div id="toast"></div>

  const albs=A.map((a,i)=>i).filter(i=>A[i].g===g);
  let parts=[];
  for(const ai of albs){
   const list=words.length?byAlbum[ai].filter(match):byAlbum[ai];
   if(!list.length)continue;total+=list.length;
   const open=isOpen(ai);
   parts.push(`<div class="album">${albumHead(ai,open)}${open?`<div class="tracks">${albumTracks(ai,list)}</div>`:""}</div>`);
  }
  if(!parts.length)continue;
  const gc=st.gclosed[g];
  const n=albs.reduce((s,ai)=>s+byAlbum[ai].length,0);
  h+=`<section class="genre"><h2 data-gh="${g}">${gc?"▶":"▼"} ${g} <small>${parts.length} álbum${parts.length>1?"es":""}${words.length?"":" · "+n+" temas"}</small></h2>${gc?"":parts.join("")}</section>`;
 }
 if(words.length&&!total)h+=`<p class="empty">Nada coincide con “${esc(st.q)}”.</p>`;
 $("#view").innerHTML=h;
}
$("#view").addEventListener("click",e=>{
 const more=e.target.closest("[data-more]");if(more){showMore[more.dataset.more]=1;render();return}
 const gh=e.target.closest("[data-gh]");if(gh){const g=gh.dataset.gh;st.gclosed[g]=!st.gclosed[g];render();return}
 const act=e.target.closest("[data-act]");
 const row=e.target.closest(".tr");const head=e.target.closest(".ahead");
 if(st.tab==="pl")return;
 if(row&&act){const i=+row.dataset.i;const a=act.dataset.act;
  if(a==="play"){const q=norm(st.q.trim());const ctx=q?visibleTracks():byAlbum[T[i][0]];playList(ctx,ctx.indexOf(i),"Álbum")}
  if(a==="add")pickPlaylist([i]);
  if(a==="dl")downloadTrack(i);return}
 if(row){const i=+row.dataset.i;const ctx=byAlbum[T[i][0]];playList(ctx,ctx.indexOf(i));return}
 if(head){const ai=+head.dataset.a;
  if(act&&act.dataset.act==="playalb"){playList(byAlbum[ai],0);return}
  if(e.target.closest("a"))return;
  st.open[ai]=!isOpen(ai);render();}
});
function isOpen(ai){if(!st.q.trim())return !!st.open[ai];return A[ai].id===BIG?st.open[ai]===true:st.open[ai]!==false}
function visibleTracks(){const q=norm(st.q.trim());const w=q.split(/\s+/).filter(Boolean);return T.map((t,i)=>i).filter(i=>(st.genre==="Todos"||A[T[i][0]].g===st.genre)&&w.every(x=>SEARCH[i].includes(x)))}
let qT;$("#q").oninput=e=>{clearTimeout(qT);qT=setTimeout(()=>{st.q=e.target.value;if(st.tab!=="lib"){setTab("lib")}else render()},180)};
$("#expAll").onclick=()=>{A.forEach((a,i)=>{if(a.id!==BIG)st.open[i]=true});render()};
$("#colAll").onclick=()=>{st.open={};A.forEach((a,i)=>{if(a.id===BIG)st.open[i]=false});render()};

// player
const au=$("#au");au.volume=.8;
let queue=[],qi=-1,cur=-1;
function playList(list,idx){queue=list.slice();qi=idx<0?0:idx;start()}
function start(){
 if(qi<0||qi>=queue.length)return;cur=queue[qi];const t=T[cur];
 au.src=url(cur);au.play().catch(err=>{if(err.name!=="AbortError")toast("No se pudo reproducir: revisa la conexión a internet")});
 $("#npT").textContent=t[2];$("#npA").textContent=artist(cur)+" · "+A[t[0]].t;$("#npImg").src=cover(t[0]);
 if("mediaSession"in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:t[2],artist:artist(cur),album:A[t[0]].t,artwork:[{src:cover(t[0])}]});}catch(e){}}
 document.querySelectorAll(".tr.playing,.ptr.playing").forEach(r=>r.classList.remove("playing"));
 document.querySelectorAll(`.tr[data-i="${cur}"]`).forEach(r=>r.classList.add("playing"));
}
function next(){if(qi<queue.length-1){qi++;start()}else{au.pause()}}
function prev(){if(au.currentTime>4){au.currentTime=0;return}if(qi>0){qi--;start()}}
$("#next").onclick=next;$("#prev").onclick=prev;
$("#play").onclick=()=>{if(cur<0){const v=st.tab==="pl"&&st.pl&&plGet(st.pl)?plTracks(plGet(st.pl)):visibleTracks();if(v.length)playList(v,0);return}au.paused?au.play():au.pause()};
au.onplay=()=>$("#play").textContent="⏸";au.onpause=()=>$("#play").textContent="▶";
au.onended=next;
au.onerror=()=>{if(au.src)toast("Este tema no se ha podido cargar desde Internet Archive",3500)};
let seeking=false;
au.ontimeupdate=()=>{if(seeking)return;const d=au.duration||T[cur]?.[4]||0;$("#cur").textContent=fmt(au.currentTime);$("#dur").textContent=fmt(d);$("#seek").value=d?Math.round(au.currentTime/d*1000):0};
$("#seek").oninput=e=>{seeking=true;const d=au.duration||0;$("#cur").textContent=fmt(d*e.target.value/1000)};
$("#seek").onchange=e=>{const d=au.duration||0;if(d)au.currentTime=d*e.target.value/1000;seeking=false};
$("#vol").oninput=e=>au.volume=e.target.value/100;
if("mediaSession"in navigator){try{navigator.mediaSession.setActionHandler("nexttrack",next);navigator.mediaSession.setActionHandler("previoustrack",prev)}catch(e){}}
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.code==="Space"){e.preventDefault();$("#play").click()}});

// downloads
const safe=s=>String(s).replace(/[\\/:*?"<>|]+/g,"_").trim().slice(0,150);
const fname=i=>safe((artist(i)?artist(i)+" - ":"")+T[i][2])+".mp3";
async function fetchSave(i){
 const r=await fetch(url(i));if(!r.ok)throw new Error(r.status);
 const b=await r.blob();const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=fname(i);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),20000);
}
async function downloadTrack(i){
 if(IOS){window.open(url(i),"_blank","noopener");toast("Se abre el MP3: pulsa Compartir → Guardar en Archivos",5000);return}
 toast("Descargando “"+T[i][2]+"”…",4000);
 try{await fetchSave(i);toast("Descarga lista: "+fname(i))}catch(e){window.open(url(i)+"?download=1","_blank");}
}
let dlBusy=false;
async function downloadMany(list,label){
 if(IOS){const p=plGet(st.pl);if(p){showLinks(p,list);toast("En iPhone no se pueden descargar varios a la vez: abre cada enlace o el ZIP del álbum",6000)}return}
 if(dlBusy){toast("Ya hay una descarga en marcha");return}
 if(!list.length)return;dlBusy=true;let ok=0,bad=0;
 for(let k=0;k<list.length;k++){
  toast(`Descargando ${label}: ${k+1} de ${list.length}…`,600000);
  try{await fetchSave(list[k]);ok++}catch(e){bad++}
  await new Promise(r=>setTimeout(r,700));
 }
 dlBusy=false;toast(`${label}: ${ok} temas descargados${bad?`, ${bad} con error`:""}. Si Chrome pregunta por “descargar varios archivos”, pulsa Permitir.`,7000);
}
function saveText(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}

// modal
function modal(html,bind){const bg=document.createElement("div");bg.className="modal-bg";bg.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(bg);const close=()=>bg.remove();bg.onclick=e=>{if(e.target===bg)close()};bind(bg,close);return bg}
function ask(title,val,cb){modal(`<h3>${esc(title)}</h3><input type="text" id="mIn" value="${esc(val||"")}" maxlength="80"><div class="row"><button id="mNo">Cancelar</button><button class="pri" id="mOk">Aceptar</button></div>`,(bg,close)=>{const i=bg.querySelector("#mIn");i.focus();i.select();const ok=()=>{const v=i.value.trim();if(v){close();cb(v)}};bg.querySelector("#mOk").onclick=ok;bg.querySelector("#mNo").onclick=close;i.onkeydown=e=>{if(e.key==="Enter")ok();if(e.key==="Escape")close()}})}
function confirmBox(title,cb){modal(`<h3>${esc(title)}</h3><div class="row"><button id="mNo">Cancelar</button><button class="pri" id="mOk" style="background:var(--bad);border-color:var(--bad)">Borrar</button></div>`,(bg,close)=>{bg.querySelector("#mOk").onclick=()=>{close();cb()};bg.querySelector("#mNo").onclick=close})}
function newPl(name){const p={id:"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,tracks:[]};pls.push(p);save();return p}
function pickPlaylist(list){
 const opts=pls.map(p=>`<button class="opt" data-p="${p.id}">${esc(p.name)} <span style="color:var(--mute)">(${p.tracks.length})</span></button>`).join("");
 modal(`<h3>Añadir ${list.length>1?list.length+" temas":"“"+esc(T[list[0]][2])+"”"} a…</h3>${opts||'<p class="note">Aún no tienes playlists.</p>'}<button class="opt pri" id="mNew">＋ Nueva playlist</button><div class="row"><button id="mNo">Cancelar</button></div>`,(bg,close)=>{
  bg.querySelector("#mNo").onclick=close;
  bg.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const p=plGet(b.dataset.p);addTo(p,list);close()});
  bg.querySelector("#mNew").onclick=()=>{close();ask("Nombre de la nueva playlist","",n=>{const p=newPl(n);addTo(p,list)})};
 });
}
function addTo(p,list){let n=0;for(const i of list){const id=tid(i);if(!p.tracks.includes(id)){p.tracks.push(id);n++}}save();toast(n?`Añadido a “${p.name}”`:`Ya estaba en “${p.name}”`);if(st.tab==="pl")renderPl()}
const plTracks=p=>p.tracks.map(id=>TID.get(id)).filter(i=>i!==undefined);

// playlists view
function renderPl(){
 if(st.pl&&!plGet(st.pl))st.pl=null;
 if(!st.pl&&pls.length)st.pl=pls[0].id;
 const p=st.pl&&plGet(st.pl);
 let h=`<div class="pl-layout"><div class="pl-list"><button class="pri" id="plNew" style="justify-content:center;margin-bottom:12px">＋ Nueva playlist</button>`+
  pls.map(x=>`<button data-sel="${x.id}" class="${p&&x.id===p.id?"on":""}"><span>${esc(x.name)}</span><span>${x.tracks.length}</span></button>`).join("")+`</div><div>`;
 if(!p){h+=`<p class="empty">Crea tu primera playlist con “＋ Nueva playlist”, y luego añade temas desde la Biblioteca con el botón ＋.</p>`}
 else{
  const ids=plTracks(p);const tot=ids.reduce((s,i)=>s+(T[i][4]||0),0);
  h+=`<div class="pl-head"><h2>${esc(p.name)}</h2><span class="note">${ids.length} temas · ${fmt(tot)}</span></div>
  <div class="pl-head"><button class="pri" data-pa="play" ${ids.length?"":"disabled"}>▶ Reproducir</button><button data-pa="ren">✎ Renombrar</button><button data-pa="del">🗑 Borrar</button><button data-pa="m3u" ${ids.length?"":"disabled"}>Exportar .m3u</button><button data-pa="links" ${ids.length?"":"disabled"}>Lista de enlaces</button><button data-pa="dl" ${ids.length?"":"disabled"}>⬇ ${IOS?"Enlaces para descargar":"Descargar playlist"}</button></div>`;
  const nolic=[...new Set(ids.map(i=>T[i][0]).filter(a=>!A[a].lic))];
  if(nolic.length)h+=`<p class="note">⚠ ${nolic.length} álbum${nolic.length>1?"es":""} de esta playlist no indican licencia: solo uso personal.</p>`;
  h+=ids.length?`<div id="plRows">`+ids.map((i,k)=>`<div class="ptr ${cur===i?"playing":""}" draggable="true" data-k="${k}" data-i="${i}"><div class="grip" title="Arrastra para mover">⠿</div><div class="n" style="color:var(--mute);text-align:right">${k+1}</div><div class="tt"><b>${esc(T[i][2])}</b><span>${esc(artist(i))} · ${esc(A[T[i][0]].t)}</span></div><div class="meta">${T[i][5]?`<span class="bpm">${+T[i][5]} BPM</span>`:""}${fmt(T[i][4])}</div><div class="btns"><button class="ic sm" data-ta="play" title="Escuchar">▶</button><button class="ic sm" data-ta="up" title="Subir" ${k?"":"disabled"}>▲</button><button class="ic sm" data-ta="down" title="Bajar" ${k<ids.length-1?"":"disabled"}>▼</button><button class="ic sm" data-ta="dl" title="${DL_LABEL}">⬇</button><button class="ic sm" data-ta="rm" title="Quitar">✕</button></div></div>`).join("")+`</div>`:`<p class="empty">Esta playlist está vacía. Ve a la Biblioteca y pulsa ＋ en los temas que quieras.</p>`;
 }
 $("#view").innerHTML=h+`</div></div>`;
 bindDrag();
}
$("#view").addEventListener("click",e=>{
 if(st.tab!=="pl")return;
 if(e.target.closest("#plNew")){ask("Nombre de la nueva playlist","",n=>{const p=newPl(n);st.pl=p.id;save();renderPl()});return}
 const sel=e.target.closest("[data-sel]");if(sel){st.pl=sel.dataset.sel;save();renderPl();return}
 const p=plGet(st.pl);if(!p)return;
 const pa=e.target.closest("[data-pa]");
 if(pa){const ids=plTracks(p);const a=pa.dataset.pa;
  if(a==="play")playList(ids,0);
  if(a==="ren")ask("Nuevo nombre",p.name,n=>{p.name=n;save();renderPl()});
  if(a==="del")confirmBox(`¿Borrar la playlist “${p.name}”?`,()=>{pls=pls.filter(x=>x!==p);st.pl=null;save();renderPl()});
  if(a==="m3u")saveText(safe(p.name)+".m3u","#EXTM3U\n#PLAYLIST:"+p.name+"\n"+ids.map(i=>`#EXTINF:${Math.round(T[i][4]||-1)},${artist(i)} - ${T[i][2]}\n${url(i)}`).join("\n")+"\n","audio/x-mpegurl");
  if(a==="links")showLinks(p,ids);
  if(a==="dl")downloadMany(ids,"“"+p.name+"”");
  return}
 const ta=e.target.closest("[data-ta]");const row=e.target.closest(".ptr");
 if(ta&&row){const k=+row.dataset.k;const a=ta.dataset.ta;const ids=plTracks(p);
  if(a==="play")playList(ids,k);
  if(a==="dl")downloadTrack(ids[k]);
  if(a==="rm"){p.tracks=ids.map(tid);p.tracks.splice(k,1);save();renderPl()}
  if(a==="up"&&k>0)move(p,k,k-1);
  if(a==="down"&&k<ids.length-1)move(p,k,k+1);
 }
});
function move(p,from,to){const arr=plTracks(p).map(tid);const [x]=arr.splice(from,1);arr.splice(to,0,x);p.tracks=arr;save();renderPl();
 if(queue.length&&st.pl===p.id&&cur>=0){const ids=plTracks(p);if(ids.includes(cur)){queue=ids;qi=ids.indexOf(cur)}}}
function showLinks(p,ids){
 const txt=ids.map(i=>url(i)).join("\n");
 const zips=[...new Set(ids.map(i=>T[i][0]))];
 modal(`<h3>Enlaces de descarga · ${esc(p.name)}</h3><textarea readonly style="width:100%;height:220px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:12px">${esc(txt)}</textarea><p class="note">Álbumes completos en ZIP:</p>${zips.map(a=>`<div style="margin:4px 0"><a style="color:var(--acc)" target="_blank" rel="noopener" href="${zipUrl(a)}">${esc(A[a].t)}</a></div>`).join("")}<div class="row"><button id="mCopy">Copiar</button><button id="mSave">Guardar .txt</button><button class="pri" id="mNo">Cerrar</button></div>`,(bg,close)=>{
  bg.querySelector("#mNo").onclick=close;
  bg.querySelector("#mSave").onclick=()=>saveText(safe(p.name)+" - enlaces.txt",txt+"\n","text/plain");
  bg.querySelector("#mCopy").onclick=()=>{const ta=bg.querySelector("textarea");ta.select();try{navigator.clipboard.writeText(txt).then(()=>toast("Enlaces copiados"),()=>{document.execCommand("copy");toast("Enlaces copiados")})}catch(e){document.execCommand("copy");toast("Enlaces copiados")}};
 })}
function bindDrag(){
 const box=$("#plRows");if(!box)return;let from=null;
 box.querySelectorAll(".ptr").forEach(r=>{
  r.ondragstart=e=>{from=+r.dataset.k;r.classList.add("drag");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",String(from))}catch(x){}};
  r.ondragend=()=>r.classList.remove("drag");
  r.ondragover=e=>{e.preventDefault();r.classList.add("over")};
  r.ondragleave=()=>r.classList.remove("over");
  r.ondrop=e=>{e.preventDefault();r.classList.remove("over");const to=+r.dataset.k;if(from!==null&&from!==to)move(plGet(st.pl),from,to);from=null};
 });
 // touch drag via the grip
 box.querySelectorAll(".grip").forEach(g=>{
  g.addEventListener("touchstart",e=>{const row=g.closest(".ptr");const k0=+row.dataset.k;row.classList.add("drag");let over=null;
   const mv=ev=>{ev.preventDefault();const t=ev.touches[0];const el=document.elementFromPoint(t.clientX,t.clientY);const r=el&&el.closest(".ptr");box.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));if(r){r.classList.add("over");over=+r.dataset.k}};
   const end=()=>{g.removeEventListener("touchmove",mv);g.removeEventListener("touchend",end);row.classList.remove("drag");if(over!==null&&over!==k0)move(plGet(st.pl),k0,over);else renderPl()};
   g.addEventListener("touchmove",mv,{passive:false});g.addEventListener("touchend",end);
  },{passive:true});
 });
}
function setTab(t){st.tab=t;$("#tabLib").classList.toggle("on",t==="lib");$("#tabPl").classList.toggle("on",t==="pl");$("#expAll").style.display=$("#colAll").style.display=t==="lib"?"":"none";renderChips();render();$("#main").scrollTop=0}
$("#tabLib").onclick=()=>setTab("lib");$("#tabPl").onclick=()=>setTab("pl");
renderChips();render();
</script>
</body>
</html>
